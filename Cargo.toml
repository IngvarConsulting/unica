[workspace]
members = ["crates/unica-bootstrap", "crates/unica-coder"]
resolver = "2"

[workspace.package]
version = "0.13.0-rc.5"
edition = "2021"
license = "LGPL-3.0-or-later"
repository = "https://github.com/IngvarConsulting/unica"

[workspace.dependencies]
# Keep these revisions aligned with the bundled analyzer in tools.lock.json.
bsl-parser = { package = "parser", git = "https://github.com/itrous/bsl-analyzer", rev = "53d8765288adf3b9277b7a4112dba167e51690b7" }
bsl-syntax = { package = "syntax", git = "https://github.com/itrous/bsl-analyzer", rev = "53d8765288adf3b9277b7a4112dba167e51690b7" }
diffy = "0.5.0"
fs2 = "0.4"
jsonschema = { version = "0.30", default-features = false }
flate2 = "1"
libc = "0.2"
# MCP transport is owned by the official Rust SDK (ADR-0013); macros stay off
# because tool schemas are data-driven by operation descriptors (ADR-0001).
rmcp = { version = "3.1.2", default-features = false, features = ["server", "transport-io"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
unsafe-libyaml = "0.2.11"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"
sha2 = "0.10"
aes-siv = { version = "0.8.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "FSEvents", "dispatch2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFString"] }
dispatch2 = { version = "0.3", default-features = false, features = ["alloc"] }
tar = "0.4"
# Политика сетевого выхода поставщиков документации (`unica.toml`,
# ADR-0032). Разбор строгий, через toml::Value, а не derive: файл запрета
# обязан отказывать на неизвестных ключах, derive их молча отбрасывает.
toml = "0.8"
roxmltree = "0.20"
xml = "1.4"
# Стемминг Snowball ru/en для лексического ядра поиска документации
# (ADR-0037). Полностью офлайн: таблицы стеммеров вкомпилированы, состояния
# на диске и сетевых обращений нет. Лицензии MIT/BSD-3.
rust-stemmers = "1.2"
tempfile = "3"
# Контейнеры справки платформы (`.hbk`) несут ZIP внутри записи FileStorage.
# `deflate` целиком тянет в производственный граф сжиматель `zopfli`, который
# здесь не нужен ничему: пишем мы только фикстуры тестов. `deflate-flate2` сам
# по себе backend не выбирает — zip объявляет `flate2` как
# `default-features = false`, — поэтому чистый Rust-backend включается явной
# зависимостью `flate2` у крейта-потребителя.
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
regex = "1"
ureq = { version = "2.12", features = ["json"] }
rustls = { version = "0.23.27", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# Запас, когда в хранилище ОС нет ни одного корня; тот же набор, что был
# у ureq по умолчанию.
webpki-roots = "1"
# Только для стендов TLS в тестах: корень и сертификат сервера на лету.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
url = "2.5.4"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }
cap-primitives = "4.0.2"
cap-fs-ext = "4.0.2"

# The daemon identity hashes the running executable at every frontend and
# daemon start; an unoptimized SHA-256 spends seconds of the connect budget
# on a debug binary.
[profile.dev.package.sha2]
opt-level = 3
