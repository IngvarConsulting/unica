[workspace]
members = ["crates/unica-bootstrap", "crates/unica-coder"]
resolver = "2"

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "LGPL-3.0-or-later"
repository = "https://github.com/IngvarConsulting/unica"

[workspace.dependencies]
# In-process parser semantics must match the bundled analyzer; a contract test
# compares these resolved revisions with third-party/tools.lock.json.
bsl-parser = { package = "parser", git = "https://github.com/itrous/bsl-analyzer", rev = "9a6cb15d60c0381dce6a3b5e536434adb12da89b" }
bsl-syntax = { package = "syntax", git = "https://github.com/itrous/bsl-analyzer", rev = "9a6cb15d60c0381dce6a3b5e536434adb12da89b" }
diffy = "0.5.0"
fs2 = "0.4"
jsonschema = { version = "0.30", default-features = false }
flate2 = "1"
libc = "0.2"
# MCP transport is owned by the official Rust SDK (ADR-0013); macros stay off
# because tool schemas are data-driven by operation descriptors (ADR-0001).
rmcp = { version = "2.2", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
# Политика сетевого выхода поставщиков документации (`unica.toml`,
# ADR-0032). Разбор строгий, через toml::Value, а не derive: файл запрета
# обязан отказывать на неизвестных ключах, derive их молча отбрасывает.
toml = "0.8"
roxmltree = "0.20"
# Стемминг Snowball ru/en для лексического ядра поиска документации
# (ADR-0035). Полностью офлайн: таблицы стеммеров вкомпилированы, состояния
# на диске и сетевых обращений нет. Лицензии MIT/BSD-3.
rust-stemmers = "1.2"
tempfile = "3"
# Контейнеры справки платформы (`.hbk`) несут ZIP внутри записи FileStorage.
# `deflate` целиком тянет в производственный граф сжиматель `zopfli`, который
# здесь не нужен ничему: пишем мы только фикстуры тестов. `deflate-flate2` сам
# по себе backend не выбирает — zip объявляет `flate2` как
# `default-features = false`, — поэтому чистый Rust-backend включается явной
# зависимостью `flate2` у крейта-потребителя.
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
ureq = { version = "2.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
cap-primitives = "4.0.2"
cap-fs-ext = "4.0.2"
