# Настройка zizmor: джоба `guards` зовёт его с этим файлом.
rules:
  unpinned-uses:
    config:
      policies:
        # Действия своей организации живут в одной зоне доверия с этим
        # репозиторием и идут по ветке; всё чужое — по хешу коммита.
        "IngvarConsulting/*": ref-pin
        "*": hash-pin
