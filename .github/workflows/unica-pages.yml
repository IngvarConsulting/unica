name: Unica Pages

# Сайт собирается из того, что уже произошло: страницы из дерева, каталог
# сценариев из приёмочного корпуса, отчёт — из результатов состоявшегося
# прогона. Своих тестов этот workflow не гоняет.
# Публикует один воркфлоу и всегда собирает сайт целиком: Pages заменяет
# артефакт полностью, поэтому «выложить только свою папку» невозможно.
# Push в main пересобирает сайт сам: страницы и каталог сценариев берутся из
# дерева, а не из чужого прогона, поэтому ждать конвейера незачем. Прогон
# нужен ради свежих результатов Allure: `workflow_run` приносит артефакты
# прогона-источника, и сайт складывает их в отчёт линии.
# Ручного запуска нет нарочно. Джоба сборки скачивает артефакт чужого прогона,
# и для CodeQL шаг после такого скачивания «отравляем», если workflow может
# запустить внешнее событие с правом писать кэш `main`: `workflow_dispatch` в
# его модели такое событие, `push` — нет. Пересобрать сайт руками можно
# перезапуском любого прошлого прогона.
on:
  push:
    branches: [main, "release-v*"]
  workflow_run:
    workflows: ["Build Unica Codex Plugin", "Unica Large", "Unica Nightly"]
    types: [completed]
    # Фильтр смотрит на `head_branch` прогона-источника: у push в ветку это
    # ветка, у тега — имя тега, у ночного прогона — всегда `main`.
    branches: [main, "release-v*", "v*"]

# Право писать на Pages нужно одной джобе — той, что публикует. Сборка только
# читает дерево и складывает артефакт, поэтому шире её права не бывают.
permissions:
  contents: read

concurrency:
  group: unica-pages
  cancel-in-progress: false

jobs:
  build:
    name: Собрать сайт
    # Push доверен: содержимое пришло в ветку этого репозитория. У `workflow_run`
    # такой опоры нет: фильтр `branches` смотрит на имя ветки прогона-источника,
    # а его выбирает автор PR — форк с веткой `main` прошёл бы через фильтр, и мы
    # опубликовали бы его содержимое у себя. Поэтому источник обязан быть
    # успешным push-прогоном этого же репозитория.
    # Красный прогон — тоже результат, и страница обязана его показать; не
    # источник только отменённый. Источник — push, расписание или ручной
    # запуск в этом репозитории: у форка ни расписания, ни push сюда нет.
    if: >-
      github.event_name == 'push' ||
      ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Артефакты прогона-источника читаются по `actions: read`; права джобы
    # заменяют права workflow целиком, поэтому `contents: read` повторён.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Отчёт собирает скачанный бинарь, и попадает он на публичный сайт.
      # Тег релиза можно переставить, поэтому принимаем не «файл по адресу», а
      # известный файл: сверенный архив 2.35.1 и ничего другого.
      - name: Поставить Allure CLI
        env:
          ALLURE_VERSION: "2.35.1"
          ALLURE_SHA256: b40c6f1f82f8b945d8b1454beb1e641f196004241e8720299aee862218bdaca6
        run: |
          set -eu
          curl -fsSL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.tgz"
          echo "$ALLURE_SHA256  allure.tgz" | sha256sum -c -
          tar -xzf allure.tgz
          echo "$PWD/allure-$ALLURE_VERSION/bin" >> "$GITHUB_PATH"

      # Линии перечисляет то же правило, что и на странице: main плюс открытые
      # релизные линии. Линия прогона-источника получает свежие результаты,
      # остальные пересобираются из того, что хранит сайт, и сохраняют подпись
      # своего прогона: иначе вчерашние счётчики выдавались бы за сегодняшние.
      # Свежие результаты приходят только с прогона-источника. Артефакт кладёт
      # тот, чей прогон его оставил, — потому джоба admits лишь push-прогон
      # этого репозитория (см. `if:` выше). План выгружен до тестов: тест из
      # плана без результата дописывается `skipped` с причиной «раннер не
      # дошёл» и не исчезает из истории.
      - if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: "{results,plan}-*"
          path: .build/artifacts
      - if: github.event_name == 'workflow_run'
        name: Сложить результаты прогона-источника
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SITE: https://ingvarconsulting.github.io/unica
        run: |
          set -eu
          mkdir -p .build
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" > .build/jobs.json
          python scripts/ci/collect-results.py --artifacts .build/artifacts --out .build/fresh \
            --jobs .build/jobs.json --fallback-line "$SOURCE_BRANCH" --site "$SITE" > .build/fresh-line.txt

      - name: Собрать отчёты линий
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: https://ingvarconsulting.github.io/unica
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url ||
            format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          RUN_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -eu
          mkdir -p .build
          python scripts/ci/site-status.py --repo "$GITHUB_REPOSITORY" \
            --print-lines --out /dev/null > .build/lines.txt
          # Массив, а не строка: имя линии приходит из ветки репозитория и
          # разваливаться на пробелах не должно.
          args=()
          while read -r line; do
            [ -n "$line" ] || continue
            # Линия со свежими результатами едет как `имя=каталог`, остальные
            # пересобираются из того, что хранит сайт.
            if [ -d ".build/fresh/$line" ]; then
              args+=(--line "$line=.build/fresh/$line")
            else
              args+=(--line "$line")
            fi
          done < .build/lines.txt
          python scripts/ci/site-status.py --repo "$GITHUB_REPOSITORY" --out .build/bootstrap.json
          python scripts/ci/build-site.py --status .build/bootstrap.json --out .build/site \
            --site "$SITE" --run-sha "$RUN_SHA" --run-url "$RUN_URL" --run-at "$RUN_AT" \
            "${args[@]}"

      # Счётчики на странице берутся из сводок собранных отчётов, поэтому
      # документ статуса считается после них, а страницы перерисовываются.
      - name: Пересобрать страницы с итоговым статусом
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url ||
            format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -eu
          python scripts/ci/site-status.py \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$RUN_BRANCH" \
            --sha "$RUN_SHA" \
            --run-url "$RUN_URL" \
            --summaries .build/site/data \
            --out .build/status.json
          python scripts/ci/build-site.py --pages-only --status .build/status.json --out .build/site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .build/site

  deploy:
    name: Опубликовать
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
