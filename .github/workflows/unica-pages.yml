name: Unica Pages

# Сайт собирается из того, что уже произошло: страницы из дерева, каталог
# сценариев из приёмочного корпуса, отчёт — из результатов состоявшегося
# прогона. Своих тестов этот workflow не гоняет.
# Публикует один воркфлоу и всегда собирает сайт целиком: Pages заменяет
# артефакт полностью, поэтому «выложить только свою папку» невозможно.
on:
  workflow_run:
    workflows: ["Build Unica Codex Plugin"]
    types: [completed]
    branches: [main, "release-v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: unica-pages
  cancel-in-progress: false

jobs:
  build:
    name: Собрать сайт
    # Фильтр `branches` смотрит на имя ветки прогона-источника, а его выбирает
    # автор PR: форк с веткой `main` прошёл бы через него, и мы скачали бы его
    # артефакты и опубликовали на своём сайте. Поэтому источник обязан быть
    # успешным push-прогоном этого же репозитория.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Отчёт собирает скачанный бинарь, и попадает он на публичный сайт.
      # Тег релиза можно переставить, поэтому принимаем не «файл по адресу», а
      # известный файл: сверенный архив 2.35.1 и ничего другого.
      - name: Поставить Allure CLI
        env:
          ALLURE_VERSION: "2.35.1"
          ALLURE_SHA256: b40c6f1f82f8b945d8b1454beb1e641f196004241e8720299aee862218bdaca6
        run: |
          set -eu
          curl -fsSL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.tgz"
          echo "$ALLURE_SHA256  allure.tgz" | sha256sum -c -
          tar -xzf allure.tgz
          echo "$PWD/allure-$ALLURE_VERSION/bin" >> "$GITHUB_PATH"

      # Линии перечисляет то же правило, что и на странице: main плюс открытые
      # релизные линии. Результаты и история каждой берутся с самого сайта — он
      # их хранит. Артефакты прогонов здесь не читаются: сегодня ни один прогон
      # не оставляет allure-results, а забирать артефакт чужого прогона в
      # workflow_run — известный способ протащить чужое содержимое в публикацию.
      # Канал для свежих результатов появится вместе с их эмиссией.
      # Метка прогона едет вместе с результатами: линия, пересобранная из того,
      # что лежит на сайте, сохраняет подпись своего прогона, а не получает
      # сегодняшнюю. Свежие результаты подписываются этим прогоном — форма
      # `--line ИМЯ=КАТАЛОГ` появится вместе с их эмиссией.
      - name: Собрать отчёты линий
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: https://ingvarconsulting.github.io/unica
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -eu
          mkdir -p .build
          python scripts/ci/site-status.py --repo "$GITHUB_REPOSITORY" \
            --print-lines --out /dev/null > .build/lines.txt
          # Массив, а не строка: имя линии приходит из ветки репозитория и
          # разваливаться на пробелах не должно.
          args=()
          while read -r line; do
            [ -n "$line" ] || continue
            args+=(--line "$line")
          done < .build/lines.txt
          python scripts/ci/site-status.py --repo "$GITHUB_REPOSITORY" --out .build/bootstrap.json
          python scripts/ci/build-site.py --status .build/bootstrap.json --out .build/site \
            --site "$SITE" --run-sha "$RUN_SHA" --run-url "$RUN_URL" --run-at "$RUN_AT" \
            "${args[@]}"

      # Счётчики на странице берутся из сводок собранных отчётов, поэтому
      # документ статуса считается после них, а страницы перерисовываются.
      - name: Пересобрать страницы с итоговым статусом
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch || 'main' }}
        run: |
          set -eu
          python scripts/ci/site-status.py \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$RUN_BRANCH" \
            --sha "$RUN_SHA" \
            --run-url "$RUN_URL" \
            --summaries .build/site/data \
            --out .build/status.json
          python scripts/ci/build-site.py --pages-only --status .build/status.json --out .build/site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .build/site

  deploy:
    name: Опубликовать
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
