name: Verify manual runner fallback
on:
  push:
    branches: [codex/unica-runner-measurement]
    paths: [.github/workflows/runner-rerun-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    name: Verify runner selected on rerun
    runs-on: ${{ fromJSON(github.run_attempt > 1 && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","unica-pve"]') }}
    timeout-minutes: 2
    steps:
      - name: Check pool and simulate first-attempt failure
        env:
          ATTEMPT: ${{ github.run_attempt }}
          POOL: ${{ runner.environment }}
        run: |
          echo "attempt=$ATTEMPT pool=$POOL runner=$RUNNER_NAME"
          if [ "$ATTEMPT" = 1 ]; then
            test "$POOL" = self-hosted
            echo "Intentional failure to verify manual rerun routing."
            exit 1
          fi
          test "$POOL" = github-hosted
