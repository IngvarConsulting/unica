name: Unica RC from Alpha

# Кандидат `vX.Y.Z-rc.N` из проверенной alpha. Берётся срез `main`, на котором ночь
# выпустила alpha, поверх него — служебный коммит, где меняется только версия, и
# тег. Тег ставит ключ развёртывания из окружения `marketplace`: оно пускает только
# `main` и `v*` и ждёт одобрения владельца. Push тега ключом запускает обычный
# выпуск по тегу (`release.yml`): полные тесты, сборку, проверки установки и канал
# `next`. Подробности — `scripts/ci/release-rc.py` и раздел rc в runbook.
on:
  workflow_dispatch:
    inputs:
      alpha:
        description: "Тег alpha, из которой ставится кандидат, например v0.15.0-alpha.4"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: unica-rc-from-alpha
  cancel-in-progress: false

jobs:
  rc:
    name: Кандидат из alpha
    environment: marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          # Срез и теги alpha и rc читаются из истории.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_KEY: ${{ secrets.RELEASE_TAG_KEY }}
          ALPHA_TAG: ${{ inputs.alpha }}
        run: python scripts/ci/release-rc.py publish --alpha "$ALPHA_TAG"
