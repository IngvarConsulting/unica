name: Probe 2054 S-978 under load

# Throwaway probe for #2054 on a scratch branch; never merged.
on:
  push:
    branches: [probe/2054-s978-linux]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/ci/requirements.txt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust-ordinary
          save-if: false
      - run: cargo build --locked -p unica-coder --bin unica
      - run: python -m tests.ci.acceptance_profiles --stage-analyzer "$RUNNER_TEMP/plugin"
      - name: Series under load
        env:
          UNICA_PROBE_2054_DIR: ${{ runner.temp }}/probe-raw
        run: |
          (timeout 3000 sh -c 'while true; do dd if=/dev/zero of="$RUNNER_TEMP/io.bin" bs=1M count=256 conv=fsync 2>/dev/null; done' &)
          for r in 1 2; do (env -u GITHUB_ACTIONS timeout 2400 python scripts/ci/run-unittest.py -s tests/ci --profile queue --size small --sizes .config/python-sizes.toml > "$RUNNER_TEMP/suite$r.log" 2>&1 &); done
          for i in 1 2 3 4; do env -u GITHUB_ACTIONS python .probe/loop.py "$RUNNER_TEMP/plugin" 25 > "$RUNNER_TEMP/par$i.log" 2>&1 & done
          wait
          pkill -f "dd if=/dev/zero" || true; pkill -f run-unittest.py || true
          grep -h "^run \|^total" "$RUNNER_TEMP"/par*.log | grep -c ok || true
          grep -h "FAIL\|^total\|RESPONSE" "$RUNNER_TEMP"/par*.log | cut -c1-3000 || true
          tail -5 "$RUNNER_TEMP"/par1.log
          grep -h "^Ran\|^OK\|^FAILED\|S-978\|provider_failed" "$RUNNER_TEMP"/suite*.log | cut -c1-600 || true
          for f in "$RUNNER_TEMP"/probe-raw/*; do echo "== $f"; cat "$f"; echo; done 2>/dev/null || true
