name: Unica Patch from Release Line

# Исправительная версия `vX.Y.Z` из головы линии `release-vX.Y`. Поверх головы —
# служебный коммит, где меняется только версия, и тег. Кнопку нажимает
# администратор репозитория: задание `admit` сверяет роль запустившего, а не имя,
# до задания с ключом. Тег ставит ключ развёртывания из окружения `alpha` (только
# `main`). Push тега ключом запускает обычный выпуск по тегу (`release.yml`) —
# полные тесты, сборку, проверки установки и сразу основной каталог
# маркетплейса — без остановок на одобрение. Затем задание `back-merge` открывает
# pull request линии обратно в `main` (шаг 3 runbook). Подробности —
# `scripts/ci/release-patch.py` и раздел о ступенях выпуска в runbook.
on:
  workflow_dispatch:
    inputs:
      line:
        description: "Ветка линии, из головы которой ставится исправительная версия, например release-v0.15"
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Кнопки кандидата и финальной версии ставят теги одного ядра и идут по одной.
concurrency:
  group: unica-release-buttons
  cancel-in-progress: false

jobs:
  # Писатель может нажать кнопку, но прогон остановится здесь: задание
  # с секретом окружения не начнётся. `triggering_actor` — тот, кто запустил
  # или перезапустил прогон: перезапуск чужого прогона роль не наследует.
  # Запуск не с `main` отказывается здесь же.
  admit:
    name: Кнопку нажал администратор
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: scripts/ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: python scripts/ci/release-rc.py admit --actor "$ACTOR" --ref "$GITHUB_REF"

  patch:
    name: Исправительная версия из линии
    needs: admit
    environment: alpha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          # Голова линии и теги её версий читаются из истории.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # «Перезапустить упавшие задания» берёт прошедший `admit` из прежней
      # попытки, поэтому роль перезапустившего сверяется ещё раз до шага с ключом.
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: python scripts/ci/release-rc.py admit --actor "$ACTOR" --ref "$GITHUB_REF"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_KEY: ${{ secrets.RELEASE_TAG_KEY }}
          LINE: ${{ inputs.line }}
        run: python scripts/ci/release-patch.py publish --line "$LINE"

  # Линия возвращается в `main` pull request (шаг 3 runbook). Ветку и pull request
  # создаёт токен прогона: ключа тегов здесь нет, а CI на таком pull request сам
  # не запускается — его запускает координатор.
  back-merge:
    name: Линия обратно в main
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Токен в дереве не остаётся: ветку слияния толкает `gh` своим помощником
      # учётных данных на время шага.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.patch.outputs.tag }}
        run: python scripts/ci/release-patch.py back-merge --tag "$TAG"
