name: Runner capacity measurement
on:
  push:
    branches: [codex/unica-runner-measurement]
    paths: [.github/workflows/runner-measurement.yml]
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  PYTHONUTF8: "1"
jobs:
  measure:
    name: Measure ${{ matrix.pool }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - pool: github
            labels: '["ubuntu-latest"]'
          - pool: proxmox
            labels: '["self-hosted", "Linux", "X64", "unica-pve"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 20aac164e3c9fc8ca7c6c6e1699e9494f99df85f
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/ci/requirements.txt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
        with:
          tool: cargo-nextest@0.9.148
      - name: Restore ordinary CI dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ci-rust-ordinary
          save-if: false
      - name: Measure commands and resource consumption
        shell: bash
        run: |
          python - <<'PY'
          #!/usr/bin/env python3
          """Throwaway benchmark: commands plus sampled VM/cgroup resource use."""
          import json
          import os
          from pathlib import Path
          import resource
          import subprocess
          import time
          
          ROOT = Path(os.environ["RUNNER_TEMP"]) / "unica-benchmark"
          ROOT.mkdir(exist_ok=True)
          CGROUP = None
          for line in Path('/proc/self/cgroup').read_text().splitlines():
              if line.startswith('0::'):
                  CGROUP = Path('/sys/fs/cgroup') / line[3:].lstrip('/')
          
          def snapshot():
              mem = {k: int(v.strip().split()[0]) * 1024 for k, v in
                     (line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())}
              cpu = [int(v) for v in Path('/proc/stat').read_text().splitlines()[0].split()[1:]]
              result = dict(at=time.time(), used_bytes=mem['MemTotal']-mem['MemAvailable'],
                            available_bytes=mem['MemAvailable'], swap_used_bytes=mem['SwapTotal']-mem['SwapFree'],
                            cpu_ticks=cpu, load=os.getloadavg())
              if CGROUP:
                  for name in ('memory.current', 'memory.peak'):
                      try:
                          result[name] = int((CGROUP / name).read_text())
                      except (OSError, ValueError):
                          pass
              return result
          
          def run(name, command):
              started = time.monotonic()
              before = resource.getrusage(resource.RUSAGE_CHILDREN)
              samples = []
              print('BENCH_START', name, flush=True)
              with (ROOT / (name+'.log')).open('w') as log, (ROOT / (name+'.samples.jsonl')).open('w') as data:
                  proc = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT)
                  while True:
                      sample = snapshot()
                      samples.append(sample)
                      data.write(json.dumps(sample)+'\n')
                      data.flush()
                      if proc.poll() is not None:
                          break
                      time.sleep(1)
              after = resource.getrusage(resource.RUSAGE_CHILDREN)
              elapsed = time.monotonic()-started
              result = dict(name=name, command=command, exit_code=proc.returncode, seconds=round(elapsed,3),
                            cpu_seconds=round(after.ru_utime+after.ru_stime-before.ru_utime-before.ru_stime,3),
                            peak_vm_used_gib=round(max(s['used_bytes'] for s in samples)/2**30,3),
                            min_vm_available_gib=round(min(s['available_bytes'] for s in samples)/2**30,3),
                            max_swap_gib=round(max(s['swap_used_bytes'] for s in samples)/2**30,3),
                            sampled_cgroup_peak_gib=round(max(s.get('memory.current',0) for s in samples)/2**30,3))
              with (ROOT/'results.jsonl').open('a') as f:
                  f.write(json.dumps(result)+'\n')
              print('BENCH_RESULT', json.dumps(result), flush=True)
              if proc.returncode:
                  print('\n'.join((ROOT/(name+'.log')).read_text(errors='replace').splitlines()[-35:]), flush=True)
              return proc.returncode
          
          identity = dict(runner=os.environ.get('RUNNER_NAME'), sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                          cpu_count=os.cpu_count(), cpuinfo=Path('/proc/cpuinfo').read_text(),
                          meminfo=Path('/proc/meminfo').read_text(),
                          rustc=subprocess.check_output(['rustc','-vV'],text=True),
                          cgroup=str(CGROUP), incremental=os.environ.get('CARGO_INCREMENTAL'),
                          cache_note='restored shared CI dependency cache; no pre-existing workspace target')
          (ROOT/'identity.json').write_text(json.dumps(identity,indent=2))
          failed = 0
          commands = [
              ('clippy-cold', ['cargo','clippy','--workspace','--all-targets','--all-features','--locked','--','-D','warnings']),
              ('python-static', ['python','scripts/ci/run-static-tests.py']),
              ('product-cold', ['python','scripts/ci/prepared_binary.py','build','--destination','.build/benchmark-product','--target-dir','target']),
              ('rust-small-cold', ['cargo','nextest','run','--workspace','--locked','--profile','pr']),
              ('clippy-warm-same-sha', ['cargo','clippy','--workspace','--all-targets','--all-features','--locked','--','-D','warnings']),
              ('product-warm-same-sha', ['python','scripts/ci/prepared_binary.py','build','--destination','.build/benchmark-product','--target-dir','target']),
          ]
          for name, command in commands:
              failed = run(name, command) or failed
          raise SystemExit(failed)
          PY
      - name: Upload measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runner-measurement-${{ matrix.pool }}
          path: ${{ runner.temp }}/unica-benchmark
          retention-days: 7
          if-no-files-found: error
