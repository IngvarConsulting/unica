name: Research 1496 Windows process signals

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-1496-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-probes:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/1496-windows-focused-probes'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.143
      - name: Validate runtime Census and immediate terminal checks
        run: |
          set -euo pipefail
          mkdir -p .session-temp/1496-native-baseline
          cargo nextest run -p unica-coder --lib --profile large --retries 0 --test-threads 2 --no-tests=fail --success-output immediate -E 'test(/^infrastructure::platform::process::/) | test(/^infrastructure::runtime_jobs::tests::/)' 2>&1 | tee .session-temp/1496-native-baseline/tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-1496-census
          path: |
            .session-temp/1496-native-baseline/tests.log
            target/nextest/large/junit.xml
          if-no-files-found: warn
