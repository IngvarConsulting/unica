name: Build Unica Codex Plugin

on:
  # Ручной запуск — полный контур: сборка инструментов, пакет, проба, сухой
  # RC, оценка. Ночь сохраняет имя `large` для истории линии, но исполняет
  # полный small/medium/large через nextest nightly-full и оба Python suites.
  # Старые large-only результаты не являются свидетельством full nightly.
  workflow_dispatch:
    inputs:
      profile:
        description: "Профиль ворот: main — очередь, large — полный nightly small/medium/large"
        type: choice
        options: [main, large]
        default: main
  pull_request:
    # Смена меток не запускает основной workflow: новый suite без `Unica CI`
    # заменяет для ruleset успешный suite той же головы PR. Метка `ci:full`
    # читается из снимка pull request при следующем push (`synchronize`).
    types: [opened, synchronize, reopened]
  # Очередь слияния: прогон на будущем состоянии main пачкой pull request.
  # Здесь ловится то, что отбор по размеру на pull request пропускает.
  merge_group:
    types: [checks_requested]
  # Push в релизную линию — ворота линии: очереди там нет, поэтому полный
  # набор тестов без отбора по файлам и без упаковки; отсюда сайт собирает
  # отчёт линии (`workflow_run` в unica-pages.yml). Push в `main` приходит из
  # очереди, и его дерево уже проверено: тестов здесь нет, Rust-джоба идёт
  # только ради записи кэша зависимостей, когда сменился его ключ или сам
  # конвейер. Упаковка, холодный старт и оценка остаются у тега и кнопки.
  push:
    branches: [main, "release-v*"]
    tags:
      - "v*"

permissions:
  contents: read

# Ворота → профиль исполнителя: pull request — `pr`, очередь слияния —
# `queue`, ручной запуск — что попросили (`main` или `large`), push в ветку
# — `main`, тег — `release`.
env:
  GATE_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'merge_group' && 'queue' || github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && 'release' || 'main' }}

# Ручной и ночной запуск идут своей группой: в общей с push они ждали бы за
# сборкой ветки, а второй push вытеснял бы ожидающий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', inputs.profile) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust_changed: ${{ steps.scope.outputs.rust_changed }}
      platform_changed: ${{ steps.scope.outputs.platform_changed }}
      toolchain_changed: ${{ steps.scope.outputs.toolchain_changed }}
      search_integration_changed: ${{ steps.scope.outputs.search_integration_changed }}
      package_changed: ${{ steps.scope.outputs.package_changed }}
      plugin_content_changed: ${{ steps.scope.outputs.plugin_content_changed }}
      ci_changed: ${{ steps.scope.outputs.ci_changed }}
      release_required: ${{ steps.scope.outputs.release_required }}
      assessment_required: ${{ steps.scope.outputs.assessment_required }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      rust_required: ${{ steps.scope.outputs.rust_required }}
      cache_required: ${{ steps.scope.outputs.cache_required }}
      line: ${{ steps.line.outputs.line }}
      runners: ${{ steps.runners.outputs.runners }}
      python_matrix: ${{ steps.python-matrix.outputs.python_matrix }}
      ordinary_build_matrix: ${{ steps.rust-matrices.outputs.ordinary_build_matrix }}
      ordinary_run_matrix: ${{ steps.rust-matrices.outputs.ordinary_run_matrix }}
      receipt_build_matrix: ${{ steps.rust-matrices.outputs.receipt_build_matrix }}
      receipt_run_matrix: ${{ steps.rust-matrices.outputs.receipt_run_matrix }}
      vendor_build_matrix: ${{ steps.rust-matrices.outputs.vendor_build_matrix }}
      vendor_run_matrix: ${{ steps.rust-matrices.outputs.vendor_run_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Раннеры матрицы Rust — две полосы. Pull request идёт только на ubuntu:
      # быстрый сигнал. Полная матрица идёт в очереди слияния, на push в ветку
      # и по кнопке: очередь проверяет ровно то дерево, что ляжет в `main`, и
      # класс дефектов `#[cfg]` ловит она, ценой одной выкидки, а не красного
      # `main`. Метка `ci:full`, прочитанная при старте прогона pull request,
      # возвращает полную матрицу.
      # Windows — только в ночном ярусе `large`: с остальных матриц он снят за
      # нестабильность раннера, а ночью сбой виден и никого не блокирует.
      - id: runners
        env:
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || '' }}
          FULL_MATRIX: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$PROFILE" = "large" ]; then
            echo 'runners=["ubuntu-latest", "macos-14", "windows-latest"]' >> "$GITHUB_OUTPUT"
          elif [ "$FULL_MATRIX" = "true" ]; then
            echo 'runners=["ubuntu-latest", "macos-14"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runners=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
      # Линия прогона едет в подписи результатов: для ветки — она сама, для
      # тега — релизная линия с его коммитом; тег вне релизной линии — отказ.
      - id: line
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "line=$(python scripts/ci/resolve-line.py --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      # Классификатор читает неизменяемые SHA из payload события. Он же
      # определяет обязательные джобы и сохраняет причину docs-only skip
      # отдельно для каждого Rust-раннера; неизвестный diff не сокращает CI.
      - id: scope
        shell: bash
        env:
          RUNNERS: ${{ steps.runners.outputs.runners }}
          RUN_LINE: ${{ steps.line.outputs.line }}
        run: python scripts/ci/classify-workflow-changes.py --github-event --runner-matrix "$RUNNERS" --line "$RUN_LINE" --results .build/ci-routing >> "$GITHUB_OUTPUT"
      # Маршрут документации сужает оба Python-набора до small; обычная
      # очередь сохраняет прежний состав. Gate сверяет эту же матрицу.
      - id: python-matrix
        env:
          DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
        run: echo "python_matrix=$(python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --python-matrix --docs-only "$DOCS_ONLY")" >> "$GITHUB_OUTPUT"
      - id: rust-matrices
        env:
          RUNNERS: ${{ steps.runners.outputs.runners }}
        run: |
          for lane in ordinary receipt vendor; do
            for phase in build run; do
              matrix="$(python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --rust-lane "$lane" --rust-matrix "$phase" --runners "$RUNNERS")"
              echo "${lane}_${phase}_matrix=$matrix" >> "$GITHUB_OUTPUT"
            done
          done
      - if: steps.scope.outputs.docs_only == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-ci-routing
          path: .build/ci-routing
          if-no-files-found: error
          retention-days: 7

  # Guards и тесты исполняются независимо. Отказ линтера или загрузки SARIF
  # не отменяет сбор тестовых результатов; обязательный gate ждёт обе ветки.
  # Находки линтера идут в Code Scanning, а не в Allure.
  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Загрузка SARIF пишет в Code Scanning; права джобы заменяют права
    # workflow целиком, поэтому `contents: read` повторён.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/ci/*.py tests/ci/*.py
      - run: python -m py_compile scripts/dev/*.py tests/dev/*.py
      - run: python scripts/ci/check-version-contract.py
      - run: python -m pip install -r tests/ci/requirements.txt
      # Форматирование от цели сборки не зависит — одного раннера хватает.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
      # Линтер workflow. Версия закреплена; находки гейт не красят — они
      # уходят в Code Scanning, где видны по правилу и строке, и разбираются
      # отдельно. Токен нужен сетевым проверкам: подменённые коммиты, известные
      # уязвимости действий.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor@1.30.0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml --format sarif --no-exit-codes .github/workflows > zizmor.sarif
      # Токен pull request из форка писать в Code Scanning не вправе; своим
      # веткам и push загрузка доступна.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  build-python-product:
    name: Ordinary binary for Python acceptance
    needs: [classify-changes]
    if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true
          shared-key: ci-python-ordinary
          save-if: ${{ github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      - run: python scripts/ci/prepared_binary.py build --destination .build/ci-product --archive .build/ci-product.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-python-ordinary
          path: .build/ci-product.tar.gz
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  test-python:
    name: Python tests (${{ matrix.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [classify-changes, build-python-product]
    # Push в `main` тестов не гоняет. Полный nightly включает Python.
    if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && (needs.build-python-product.result == 'success' || needs.build-python-product.result == 'skipped') }}
    # Наборы идут параллельными джобами, по одной на набор, а `tests/ci` —
    # по полосам размера: одним процессом он шёл в очереди шесть с половиной
    # минут, из них четыре — несколько `medium`-тестов. Матрицу считает шов
    # по воротам; каждая джоба зовёт тот же шов с `--suite` и `--only-size`,
    # гейт видит одну джобу.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify-changes.outputs.python_matrix) }}
    env:
      RUN_LINE: ${{ needs.classify-changes.outputs.line }}
      SUITE: ${{ matrix.suite }}
      LANE: ${{ matrix.lane }}
      DOCS_ONLY: ${{ needs.classify-changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Страж неизменности продукта сравнивает с базой — нужна история.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/ci/requirements.txt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - if: needs.build-python-product.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-python-ordinary
          path: .build/ci-product-input
      - if: needs.build-python-product.result == 'success'
        shell: bash
        run: |
          python scripts/ci/prepared_binary.py unpack --archive .build/ci-product-input/ci-product.tar.gz --destination .build/ci-prepared-product
          echo "UNICA_PREPARED_BINARY_MANIFEST=$PWD/.build/ci-prepared-product/manifest.json" >> "$GITHUB_ENV"
      # План выгружается до тестов, как у Rust: джоба, умершая на середине
      # набора, оставляет состав, и недошедшие тесты попадут в отчёт `skipped`.
      - run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem python --suite "$SUITE" --only-size "$LANE" --docs-only "$DOCS_ONLY" --plan-only --results .build/results --runner ubuntu-latest --line "$RUN_LINE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-python-${{ matrix.slug }}
          path: .build/results
          retention-days: 7
          overwrite: true
      # Наборы гоняет одна точка входа: профиль ворот меняется в ней, а не
      # здесь; `--suite` сужает вызов до набора этой джобы.
      - run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem python --suite "$SUITE" --only-size "$LANE" --docs-only "$DOCS_ONLY" --results .build/results --runner ubuntu-latest --line "$RUN_LINE"
      # Результаты едут артефактом и при красном прогоне: ради них он и шёл.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-python-${{ matrix.slug }}
          path: .build/results
          retention-days: 7
          overwrite: true

  shadow-component-selection:
    name: Component selection (shadow; full gate retained)
    needs: [classify-changes]
    if: ${{ needs.classify-changes.outputs.rust_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/ci/ci_shadow_selector.py --out .build/ci-shadow/selection.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-shadow-selection
          path: .build/ci-shadow
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  build-rust-ordinary:
    name: Build Rust ordinary (${{ matrix.runner }})
    needs: [classify-changes]
    if: ${{ needs.classify-changes.outputs.rust_required == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'large' && 180 || 60 }}
    continue-on-error: ${{ matrix.runner == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify-changes.outputs.ordinary_build_matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      MATRIX_RUNNER: ${{ matrix.runner }}
      PYTHONUTF8: "1"
      RUN_LINE: ${{ needs.classify-changes.outputs.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true
          shared-key: ci-rust-ordinary
          save-if: ${{ github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          cache-on-failure: true
      - run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --rust-lane ordinary --phase build --prepared .build/ci-lane --runner "$MATRIX_RUNNER" --line "$RUN_LINE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-rust-archive-${{ matrix.runner }}-ordinary
          path: |
            .build/ci-lane/tests.tar.zst
            .build/ci-lane/lane.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-rust-${{ matrix.runner }}-ordinary
          path: .build/ci-lane/*.json
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

  run-rust-ordinary:
    name: Rust ordinary (${{ matrix.runner }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [classify-changes, build-rust-ordinary, shadow-component-selection]
    if: ${{ needs.classify-changes.outputs.rust_required == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'large' && 180 || 60 }}
    continue-on-error: ${{ matrix.runner == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify-changes.outputs.ordinary_run_matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      MATRIX_RUNNER: ${{ matrix.runner }}
      PYTHONUTF8: "1"
      SHARD: ${{ matrix.shard }}
      RUN_LINE: ${{ needs.classify-changes.outputs.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-rust-archive-${{ matrix.runner }}-ordinary
          path: .build/ci-lane
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-shadow-selection
          path: .build/ci-shadow
      - run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --rust-lane ordinary --phase run --prepared .build/ci-lane --shard "$SHARD" --results .build/results --runner "$MATRIX_RUNNER" --line "$RUN_LINE" --shadow .build/ci-shadow/selection.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-rust-${{ matrix.runner }}-ordinary-${{ matrix.shard }}
          path: .build/results
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

  build-rust-receipt:
    name: Build Rust receipt (${{ matrix.runner }})
    needs: [classify-changes]
    if: ${{ needs.classify-changes.outputs.rust_required == 'true' && github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'large' && 180 || 60 }}
    continue-on-error: ${{ matrix.runner == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify-changes.outputs.receipt_build_matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      MATRIX_RUNNER: ${{ matrix.runner }}
      PYTHONUTF8: "1"
      RUN_LINE: ${{ needs.classify-changes.outputs.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true
          shared-key: ci-rust-receipt
          save-if: ${{ github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          cache-on-failure: true
      - run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --rust-lane receipt --phase build --prepared .build/ci-lane --runner "$MATRIX_RUNNER" --line "$RUN_LINE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-rust-archive-${{ matrix.runner }}-receipt
          path: |
            .build/ci-lane/tests.tar.zst
            .build/ci-lane/lane.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-rust-${{ matrix.runner }}-receipt
          path: .build/ci-lane/*.json
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

