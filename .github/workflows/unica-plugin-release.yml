name: Build Unica Codex Plugin
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [main, large]
        default: main
        description: "Ignored by this isolated S978 diagnostic"
permissions:
  contents: read
concurrency:
  group: diagnostic-s978-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnostic-s978:
    name: S978 trace (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: base80ad
            source: 80ad95b3fe8e46bd8d9964387c10af19566d68ea
          - arm: candidate47cdae
            source: 47cdae67e8248432ff539c554bc7023065ebed79
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TARGET_DIR: ${{ github.workspace }}/case/target
      DIAGNOSTIC_SOURCE: ${{ matrix.source }}
      DIAGNOSTIC_ARM: ${{ matrix.arm }}
    steps:
      - name: Checkout diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Checkout exact compared source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ matrix.source }}
          path: case
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply identical trace-only probe and build owned core
        working-directory: case
        run: |
          mkdir -p "$GITHUB_WORKSPACE/proof"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/proof/source-head.txt"
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE"
          git apply "$GITHUB_WORKSPACE/control/scripts/ci/diagnostic-s978/trace-only.patch"
          git diff --check
          rustc -Vv > "$GITHUB_WORKSPACE/proof/rustc.txt"
          cargo -V > "$GITHUB_WORKSPACE/proof/cargo.txt"
          cargo build --locked --bin unica --message-format=json > "$GITHUB_WORKSPACE/proof/build.jsonl" 2> "$GITHUB_WORKSPACE/proof/build.stderr"
          python "$GITHUB_WORKSPACE/control/scripts/ci/diagnostic-s978/verify-build.py" "$GITHUB_WORKSPACE/proof/build.jsonl" "$CARGO_TARGET_DIR/debug/unica" "$PWD" > "$GITHUB_WORKSPACE/proof/build-origin.json"
          sha256sum "$CARGO_TARGET_DIR/debug/unica" > "$GITHUB_WORKSPACE/proof/core.sha256"
          sha256sum Cargo.lock > "$GITHUB_WORKSPACE/proof/Cargo.lock.sha256"
          git diff --binary > "$GITHUB_WORKSPACE/proof/trace-source.patch"
      - name: Stage exact pinned analyzer
        working-directory: case
        run: |
          python -m pip install -r tests/ci/requirements.txt
          python -m tests.ci.acceptance_profiles --stage-analyzer "$GITHUB_WORKSPACE/staged-plugin"
      - name: Observe ten fresh S978 scenarios
        working-directory: case
        run: |
          core_sha=$(sha256sum "$CARGO_TARGET_DIR/debug/unica" | cut -d ' ' -f 1)
          python "$GITHUB_WORKSPACE/control/scripts/ci/diagnostic-s978/capture-s978-linux.py" --repo "$PWD" --source-ref "$DIAGNOSTIC_SOURCE" --binary "$CARGO_TARGET_DIR/debug/unica" --binary-sha256 "$core_sha" --plugin "$GITHUB_WORKSPACE/staged-plugin" --proposal "$GITHUB_WORKSPACE/control/scripts/ci/diagnostic-s978" --output "$GITHUB_WORKSPACE/proof/observations" > "$GITHUB_WORKSPACE/proof/capture.stdout" 2> "$GITHUB_WORKSPACE/proof/capture.stderr"
      - name: Retain executable and source evidence
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/proof"
          if [ -f "$CARGO_TARGET_DIR/debug/unica" ]; then
            gzip -c "$CARGO_TARGET_DIR/debug/unica" > "$GITHUB_WORKSPACE/proof/instrumented-unica.gz"
          fi
          cp "$GITHUB_WORKSPACE/control/scripts/ci/diagnostic-s978/proposal.json" "$GITHUB_WORKSPACE/proof/proposal.json"
          cp "$GITHUB_WORKSPACE/control/scripts/ci/diagnostic-s978/trace-only.patch" "$GITHUB_WORKSPACE/proof/reviewed-trace.patch"
          cp "$GITHUB_WORKSPACE/control/scripts/ci/diagnostic-s978/capture-s978-linux.py" "$GITHUB_WORKSPACE/proof/capture-controller.py"
          cp "$GITHUB_WORKSPACE/control/.github/workflows/unica-plugin-release.yml" "$GITHUB_WORKSPACE/proof/diagnostic-workflow.yml"
          uname -a > "$GITHUB_WORKSPACE/proof/uname.txt"
      - name: Preserve every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostic-s978-${{ matrix.arm }}
          path: proof
          retention-days: 7
          if-no-files-found: error
