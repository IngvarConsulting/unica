name: Probe native form lifecycle assertion
run-name: Native Windows form lifecycle at 7f13026f
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-form-lifecycle:
    name: Native Windows form lifecycle
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7f13026fad2a00d2967aeddc4371a370a5fa74b1
          persist-credentials: false
      - name: Verify the source under test
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '7f13026fad2a00d2967aeddc4371a370a5fa74b1') { throw "Unexpected source commit $actual" }
          $path = 'crates/unica-coder/src/infrastructure/daemon/form_lifecycle_tests.rs'
          $digest = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          if ($digest -ne 'f036ef964cf431881631227f2f0fcdcf5a5134cb37f2a464dd6d2d2686b47a7a') { throw "Unexpected lifecycle test source $digest" }
          "source=$actual testSha256=$digest" | Set-Content -Encoding utf8 source-proof.txt
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - name: Run the canonical form lifecycle on Windows
        run: |
          cargo test --locked -p unica-coder --lib infrastructure::daemon::server::form_lifecycle_tests::canonical_form_lifecycle_preserves_companions_and_removes_the_entire_resource -- --exact --nocapture 2>&1 | Tee-Object -FilePath native-lifecycle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content -Raw native-lifecycle.log
          $name = [regex]::Escape('infrastructure::daemon::server::form_lifecycle_tests::canonical_form_lifecycle_preserves_companions_and_removes_the_entire_resource')
          if ($log -notmatch "test $name \.\.\. ok") { throw 'The named lifecycle test did not pass' }
          if ($log -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') { throw 'Expected exactly one executed passing lifecycle test' }
      - name: Save native proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-windows-form-lifecycle-7f13026f
          path: |
            source-proof.txt
            native-lifecycle.log
          if-no-files-found: error
