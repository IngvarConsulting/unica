name: V014 retained directory Windows proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-proof:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify the tested source identity
        run: |
          mkdir -p .build/v014-directory
          test "$(git rev-parse HEAD^)" = "440378dcbbcd19b171e60fb093236596ff5c32f9"
          git diff --exit-code 440378dcbbcd19b171e60fb093236596ff5c32f9 HEAD -- . ':(exclude).github/workflows/unica-plugin-release.yml'
          git diff --exit-code HEAD
          git rev-parse HEAD | tee .build/v014-directory/diagnostic-commit.txt
          git rev-parse HEAD:crates/unica-coder | tee .build/v014-directory/tested-source-tree.txt
          git rev-parse HEAD:.config/nextest.toml | tee .build/v014-directory/nextest-config-blob.txt
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.148
      - name: Native Windows affected tests without retries
        run: |
          set -o pipefail
          cargo nextest --version | tee .build/v014-directory/nextest-version.txt
          rustc -Vv | tee .build/v014-directory/rustc-version.txt
          cargo nextest run --locked -p unica-coder --lib --profile queue --retries 0 --no-fail-fast -E 'test(/^infrastructure::native_operations::apply::/) | test(/^infrastructure::native_operations::compile_transaction::/) | test(/^infrastructure::native_operations::apply_families::metadata::/) | test(/^infrastructure::native_operations::apply_families::form_resource::/) | test(/^infrastructure::workspace_actor::/) | test(/^infrastructure::platform::filesystem::/) | test(/^infrastructure::native_operations::retained_directory::/) | test(/^infrastructure::daemon::server::retained_directory_removal_tests::/) | test(/^infrastructure::daemon::server::form_lifecycle_tests::/)' 2>&1 | tee .build/v014-directory/affected.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v014-directory-windows-retries-zero
          path: .build/v014-directory
          retention-days: 7
