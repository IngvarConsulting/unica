name: Build Unica Codex Plugin

on:
  # Ручной запуск — полный контур: сборка инструментов, пакет, проба, сухой
  # RC, оценка. Ночь запускает его на сдвинувшейся линии с `profile: large`:
  # тесты идут ярусом `large` (на Windows — весь набор), а сайт пишет память
  # о проверенной вершине.
  workflow_dispatch:
    inputs:
      profile:
        description: "Профиль ворот: main — как push в ветку, large — ночной ярус"
        type: choice
        options: [main, large]
        default: main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Очередь слияния: прогон на будущем состоянии main пачкой pull request.
  # Здесь ловится то, что отбор по размеру на pull request пропускает.
  merge_group:
    types: [checks_requested]
  # Push в main и релизную линию — ворота линии: полный набор тестов без
  # отбора по файлам и без упаковки. Отсюда сайт собирает опубликованный
  # отчёт (`workflow_run` в unica-pages.yml). Упаковка, холодный старт и
  # оценка остаются у тега и ручного запуска.
  push:
    branches: [main, "release-v*"]
    tags:
      - "v*"

permissions:
  contents: read

# Ворота → профиль исполнителя: pull request — `pr`, очередь слияния —
# `queue`, ручной запуск — что попросили (`main` или `large`), push в ветку
# — `main`, тег — `release`.
env:
  GATE_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'merge_group' && 'queue' || github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && 'release' || 'main' }}

# Ручной и ночной запуск идут своей группой: в общей с push они ждали бы за
# сборкой ветки, а второй push вытеснял бы ожидающий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', inputs.profile) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust_changed: ${{ steps.scope.outputs.rust_changed }}
      platform_changed: ${{ steps.scope.outputs.platform_changed }}
      toolchain_changed: ${{ steps.scope.outputs.toolchain_changed }}
      search_integration_changed: ${{ steps.scope.outputs.search_integration_changed }}
      package_changed: ${{ steps.scope.outputs.package_changed }}
      plugin_content_changed: ${{ steps.scope.outputs.plugin_content_changed }}
      ci_changed: ${{ steps.scope.outputs.ci_changed }}
      release_required: ${{ steps.scope.outputs.release_required }}
      assessment_required: ${{ steps.scope.outputs.assessment_required }}
      line: ${{ steps.line.outputs.line }}
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Раннеры матрицы Rust. Windows — только в ночном ярусе `large`: с
      # матрицы pull request и main он снят за нестабильность раннера, а
      # ночью сбой виден и никого не блокирует.
      - id: runners
        env:
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || '' }}
        run: |
          if [ "$PROFILE" = "large" ]; then
            echo 'runners=["ubuntu-latest", "macos-14", "windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runners=["ubuntu-latest", "macos-14"]' >> "$GITHUB_OUTPUT"
          fi
      # Линия прогона едет в подписи результатов: для ветки — она сама, для
      # тега — релизная линия с его коммитом; тег вне релизной линии — отказ.
      - id: line
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "line=$(python scripts/ci/resolve-line.py --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - id: scope
        shell: bash
        env:
          FORCE_FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          # A branch name reaches the shell as data, never as script text. Git
          # ref rules allow `;`, `$`, backticks and parentheses, so `${{ }}`
          # pasted straight into `run:` would be a command-injection sink the
          # day someone pushes a branch named for one.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$FORCE_FULL" = "true" ]; then
            python scripts/ci/classify-workflow-changes.py --force-full </dev/null >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          git diff --name-only FETCH_HEAD...HEAD |
            python scripts/ci/classify-workflow-changes.py >> "$GITHUB_OUTPUT"

  # Дешёвое раньше дорогого: линтеры и проверки реестра отвечают за минуту,
  # тесты ждут их. Результат линтера — находка, а не исход теста: она едет в
  # Code Scanning (SARIF), а не в Allure.
  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Загрузка SARIF пишет в Code Scanning; права джобы заменяют права
    # workflow целиком, поэтому `contents: read` повторён.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The architecture-sync guard diffs against the merge base, which a
          # shallow clone cannot compute.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/ci/*.py tests/ci/*.py
      - run: python -m py_compile scripts/arch/*.py tests/arch/*.py
      - run: python -m py_compile scripts/dev/*.py tests/dev/*.py
      - run: python scripts/ci/check-version-contract.py
      - name: Check accepted architecture records
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          python scripts/arch/registry.py --check
          python scripts/arch/fate.py
          python scripts/arch/immutability.py --base FETCH_HEAD
      # Форматирование от цели сборки не зависит — одного раннера хватает.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
      # Линтер workflow. Версия закреплена; находки гейт не красят — они
      # уходят в Code Scanning, где видны по правилу и строке, и разбираются
      # отдельно. Токен нужен сетевым проверкам: подменённые коммиты, известные
      # уязвимости действий.
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: zizmor@1.30.0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml --format sarif --no-exit-codes .github/workflows > zizmor.sarif
      # Токен pull request из форка писать в Code Scanning не вправе; своим
      # веткам и push загрузка доступна.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  test-python:
    name: Python tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [classify-changes, guards]
    env:
      RUN_LINE: ${{ needs.classify-changes.outputs.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Страж неизменности продукта сравнивает с базой — нужна история.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/ci/requirements.txt
      # Наборы гоняет одна точка входа: профиль ворот меняется в ней, а не в
      # трёх строках здесь. Сегодня `all` повторяет прежние команды один в один.
      - run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem python --results .build/results --runner ubuntu-latest --line "$RUN_LINE"
      # Результаты едут артефактом и при красном прогоне: ради них он и шёл.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-python
          path: .build/results
          retention-days: 7
          overwrite: true

  test-rust-platforms:
    name: Rust tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    needs: [classify-changes, guards]
    env:
      RUN_LINE: ${{ needs.classify-changes.outputs.line }}
      # Консоль Windows — cp1252: без этого Python не выведет кириллицу
      # скриптов площадки и упадёт на первом же `print`.
      PYTHONUTF8: "1"
      # Имя раннера идёт в команды через env, а не подстановкой в текст скрипта.
      MATRIX_RUNNER: ${{ matrix.runner }}
    # Windows идёт только в ночном ярусе, и его сбой обязан быть виден, но
    # не должен блокировать упаковку и пробу того же прогона.
    continue-on-error: ${{ matrix.runner == 'windows-latest' }}
    # Любая правка Rust идёт на обеих платформах: `#[cfg]` решает, какие
    # элементы существуют, и один раннер этого класса не видит. Прежняя
    # экономия — один раннер для rust-only pull request — снята: под
    # профилем `pr` тесты идут полминуты, а сборку платишь всё равно.
    if: >-
      ${{
        needs.classify-changes.outputs.rust_changed == 'true' ||
        needs.classify-changes.outputs.platform_changed == 'true' ||
        needs.classify-changes.outputs.toolchain_changed == 'true' ||
        needs.classify-changes.outputs.ci_changed == 'true'
      }}
    strategy:
      fail-fast: false
      matrix:
        # Список считает `classify-changes`: ubuntu и macOS всегда, Windows —
        # только в ночном ярусе `large`.
        runner: ${{ fromJSON(needs.classify-changes.outputs.runners) }}
    # Шаги написаны на bash: на Windows умолчание — pwsh, и `$RUN_LINE` там
    # значил бы другое.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      # В PR-джобе тесты идут полминуты, а компиляция — от пяти до восьми
      # минут; кэшируются только зависимости, крейты workspace собираются
      # каждый раз. Пишут кэш push в ветку и ручной запуск: их область
      # читают все прогоны. Pull request и очередь только читают — их
      # области никто другой не увидит, а десять гигабайт кэша общие.
      # Джоба тестов артефактов релиза не собирает, а область кэша pull
      # request читают только его же прогоны — отравить релиз через неё нельзя.
      - name: Кэш зависимостей Rust # zizmor: ignore[cache-poisoning] джоба тестов артефактов релиза не собирает, область кэша pull request читают только его прогоны
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          cache-on-failure: true
      # `python3` есть не на каждом раннере: на Windows его даёт setup-python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Форматирование от цели не зависит — оно в `guards`. Линт зависит:
      # `#[cfg]` решает, какие элементы существуют, поэтому clippy идёт на
      # каждом раннере матрицы, своим шагом до тестов. Находки едут в Code
      # Scanning, а `-D warnings` по-прежнему красит джобу. Версии закреплены:
      # исполнители — часть контракта прогона.
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-nextest@0.9.143,clippy-sarif@0.8.0,sarif-fmt@0.8.0
      # Подпись и план выгружаются раньше линта и тестов: раннер, упавший на
      # clippy или сборке, оставляет подпись, и недошедшие тесты попадут в
      # отчёт как `skipped`, а не исчезнут из него.
      - run: python3 scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --plan-only --results .build/results --runner "$MATRIX_RUNNER" --line "$RUN_LINE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-rust-${{ matrix.runner }}
          # План с подписью: сайт сопоставляет его с результатами по линии и раннеру.
          path: .build/results
          retention-days: 7
          overwrite: true
      - run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --message-format=json -- -D warnings \
            | clippy-sarif | tee clippy.sarif | sarif-fmt
      - if: always() && hashFiles('clippy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: clippy.sarif
          category: clippy-${{ matrix.runner }}
      - run: python3 scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --results .build/results --runner "$MATRIX_RUNNER" --line "$RUN_LINE"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-rust-${{ matrix.runner }}
          path: .build/results
          retention-days: 7
          overwrite: true

  build-tools:
    name: Build tools (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: [classify-changes, guards, test-python, test-rust-platforms]
    if: >-
      ${{
        always() &&
        needs.classify-changes.result == 'success' &&
        needs.guards.result == 'success' &&
        needs.test-python.result == 'success' &&
        (needs.test-rust-platforms.result == 'success' || needs.test-rust-platforms.result == 'skipped') &&
        (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) &&
        (needs.classify-changes.outputs.release_required == 'true' ||
         needs.classify-changes.outputs.ci_changed == 'true')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: win-x64
            runner: windows-latest
          - target: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - if: matrix.target == 'win-x64'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # package.json здесь нет: кэшу пакетов нечего хранить, а в релизном
          # контуре его и не должно быть.
          package-manager-cache: false
      - name: Install pinned Codex CLI on Windows # zizmor: ignore[adhoc-packages] версия закреплена точно и сверяется после установки
        if: matrix.target == 'win-x64'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @openai/codex@0.145.0-alpha.18
          test "$(codex --version)" = "codex-cli 0.145.0-alpha.18"
      - id: rust-toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # Сборка тега читает только кэш, записанный прогонами main; pull request
      # пишет лишь в свою область и до релизной сборки не дотягивается.
      - id: cargo-cache # zizmor: ignore[cache-poisoning] кэш пишут только прогоны main, pull request в их область не пишет
        name: Restore Cargo target cache
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/tool-work/${{ matrix.target }}/cargo-target
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
      - name: Build target bundle and bootstrap
        if: matrix.target != 'win-x64'
        run: >
          python scripts/ci/build-unica-tools.py
          --repo-root .
          --target "${{ matrix.target }}"
          --lock-file plugins/unica/third-party/tools.lock.json
          --out-dir ".build/tool-bundles/${{ matrix.target }}"
          --work-dir .build/tool-work
          --metrics-file ".build/cargo-metrics/${{ matrix.target }}.json"
      - name: Build, install, and verify local development on Windows
        if: matrix.target == 'win-x64'
        shell: bash
        run: |
          set -euo pipefail
          build_root="$PWD/.build"
          codex_home="$(cygpath -m "$build_root/codex-home")"
          CODEX_HOME="$codex_home" \
            scripts/dev/install-local-unica.sh \
              --build-dir "$build_root"

          bundle_manifest="$(find "$build_root/tool-artifacts" \
            -mindepth 2 -maxdepth 2 -name tools.json -print -quit)"
          if [ -z "$bundle_manifest" ]; then
            echo "local installer did not produce a tool bundle" >&2
            exit 66
          fi
          bundle_root="$(dirname "$bundle_manifest")"
          mkdir -p "$PWD/.build/tool-bundles"
          rm -rf "$PWD/.build/tool-bundles/win-x64"
          cp -R "$bundle_root" "$PWD/.build/tool-bundles/win-x64"
      - name: Report Cargo cache and build metrics
        if: always()
        shell: bash
        env:
          CACHE_STEP_OUTCOME: ${{ steps.cargo-cache.outcome }}
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          METRICS_FILE: .build/cargo-metrics/${{ matrix.target }}.json
          TARGET: ${{ matrix.target }}
        run: |
          set -u
          cache_outcome=miss
          if [ "$CACHE_STEP_OUTCOME" != "success" ]; then
            cache_outcome=error
          elif [ "$CACHE_HIT" = "true" ]; then
            cache_outcome=exact-hit
          fi
          cargo_seconds="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["cargoBuildSeconds"])' "$METRICS_FILE" 2>/dev/null || true)"
          if [ -z "$cargo_seconds" ]; then cargo_seconds=unavailable; fi
          archive_download_seconds="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["archiveDownloadSeconds"])' "$METRICS_FILE" 2>/dev/null || true)"
          if [ -z "$archive_download_seconds" ]; then archive_download_seconds=unavailable; fi
          {
            echo "### Cargo build ($TARGET)"
            echo
            echo "- Target: \`$TARGET\`"
            echo "- Cache outcome: \`$cache_outcome\`"
            echo "- Cargo build duration: \`$cargo_seconds\` seconds"
            echo "- RLM archive download duration: \`$archive_download_seconds\` seconds"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check bundled tool contracts
        run: >
          python scripts/ci/check-tool-contracts.py
          --target "${{ matrix.target }}"
          --tools-dir ".build/tool-bundles/${{ matrix.target }}/bin/${{ matrix.target }}"
      - name: Package deterministic runtime
        run: >
          python scripts/ci/package-unica-runtime.py
          --bundle-root ".build/tool-bundles/${{ matrix.target }}"
          --out-dir ".build/runtime-assets/${{ matrix.target }}"
      - name: Verify local runtime asset pair
        run: >
          python scripts/ci/verify-release-assets.py
          --asset-dir ".build/runtime-assets/${{ matrix.target }}"
          --target "${{ matrix.target }}"
          --source local-build
          --report ".build/runtime-assets/${{ matrix.target }}/asset-verification-${{ matrix.target }}.json"
      - name: Report standalone runtime size evidence
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLE_ROOT: .build/tool-bundles/${{ matrix.target }}
          WORK_ROOT: .build/tool-work/${{ matrix.target }}
          ASSET_ROOT: .build/runtime-assets/${{ matrix.target }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import tarfile
          from pathlib import Path

          target = os.environ["TARGET"]
          lock = json.loads(
              Path("plugins/unica/third-party/tools.lock.json").read_text(encoding="utf-8")
          )
          rlm_tools = [
              tool
              for tool in lock["tools"]
              if tool["name"] in {"rlm-bsl-index", "rlm-bsl-mcp"}
          ]
          assets = [tool["assets"][target] for tool in rlm_tools]
          asset_names = {asset["assetName"] for asset in assets}
          asset_sizes = {asset["size"] for asset in assets}
          if len(rlm_tools) != 2 or len(asset_names) != 1 or len(asset_sizes) != 1:
              raise SystemExit("RLM archive lock identity is not shared")
          asset_name = next(iter(asset_names))
          expected_archive_bytes = next(iter(asset_sizes))
          matches = sorted(Path(os.environ["WORK_ROOT"]).joinpath("downloads").glob(f"*-{asset_name}"))
          if len(matches) != 1:
              raise SystemExit(f"expected one downloaded RLM archive, found {len(matches)}")
          source_archive = matches[0]
          if source_archive.stat().st_size != expected_archive_bytes:
              raise SystemExit("downloaded RLM archive size differs from lock")
          with tarfile.open(source_archive, "r:gz") as archive:
              stream = archive.extractfile("manifest.json")
              if stream is None:
                  raise SystemExit("RLM archive manifest is missing")
              rlm_manifest = json.load(stream)
          extracted_rlm_bytes = sum(item["size"] for item in rlm_manifest["files"])

          tools_path = Path(os.environ["BUNDLE_ROOT"]) / "tools.json"
          manifest = json.loads(tools_path.read_text(encoding="utf-8"))
          runtime_file_count = len(manifest["runtimeFiles"])
          runtime_archive = (
              Path(os.environ["ASSET_ROOT"]) / f"unica-runtime-{target}.tar.gz"
          )
          final_runtime_bytes = runtime_archive.stat().st_size
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"### Standalone runtime size ({target})\n\n")
              summary.write(f"- RLM source archive bytes: `{source_archive.stat().st_size}`\n")
              summary.write(f"- RLM extracted payload bytes: `{extracted_rlm_bytes}`\n")
              summary.write(f"- Final runtime archive bytes: `{final_runtime_bytes}`\n")
              summary.write(f"- Runtime file count: `{runtime_file_count}`\n")
          PY
      - name: Extract deterministic runtime for MCP smoke
        shell: bash
        run: |
          set -euo pipefail
          runtime_root=".build/runtime-smoke/${{ matrix.target }}"
          mkdir -p "$runtime_root"
          tar -xzf ".build/runtime-assets/${{ matrix.target }}/unica-runtime-${{ matrix.target }}.tar.gz" \
            -C "$runtime_root"
          # Этот смоук проверяет сам runtime и требует настоящий поиск. Тонкое
          # ядро движков не несёт, поэтому прямому запуску явно даём проверенные
          # файлы той же target-сборки. Доставку проверяют bootstrap-пробы.
          cp -R ".build/tool-bundles/${{ matrix.target }}/bin/${{ matrix.target }}/." \
            "$runtime_root/bin/${{ matrix.target }}/"
      - name: Verify Windows Job Object root and child cleanup
        if: matrix.target == 'win-x64'
        shell: bash
        timeout-minutes: 1
        run: >-
          python tests/ci/test_smoke_unica_mcp.py
          SmokeUnicaMcpTests.test_windows_job_object_reaps_root_and_child
      - name: Smoke packaged Unica MCP
        shell: bash
        timeout-minutes: 3
        run: |
          runtime_root=".build/runtime-smoke/${{ matrix.target }}"
          executable="$runtime_root/bin/${{ matrix.target }}/unica"
          if [ "${{ matrix.target }}" = "win-x64" ]; then executable="${executable}.exe"; fi
          python scripts/ci/smoke-unica-mcp.py \
            --binary "$executable" \
            --plugin-root "$runtime_root" \
            --total-timeout-seconds 120
      - name: Probe native package wire profile
        shell: bash
        env:
          UNICA_PROVIDER_STATE_DIR: ${{ runner.temp }}/unica-p0-${{ matrix.target }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          executable=".build/tool-bundles/$TARGET/bin/$TARGET/unica"
          if [ "$TARGET" = "win-x64" ]; then executable="${executable}.exe"; fi
          python scripts/ci/probe-unica-wire.py \
            --binary "$executable" \
            --protocol-version 2026-07-28 \
            --tasks-capability on \
            --profile native \
            --target "$TARGET" \
            --output ".build/p0-wire/native-$TARGET.json"
      - name: Probe compatibility package wire profile
        shell: bash
        env:
          UNICA_PROVIDER_STATE_DIR: ${{ runner.temp }}/unica-p0-${{ matrix.target }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          executable=".build/tool-bundles/$TARGET/bin/$TARGET/unica"
          if [ "$TARGET" = "win-x64" ]; then executable="${executable}.exe"; fi
          python scripts/ci/probe-unica-wire.py \
            --binary "$executable" \
            --protocol-version 2025-06-18 \
            --tasks-capability off \
            --profile compatibility \
            --target "$TARGET" \
            --output ".build/p0-wire/compatibility-$TARGET.json"
      - name: Stage exact bootstrap payload
        shell: bash
        run: |
          bootstrap_name=unica-bootstrap
          if [ "${{ matrix.target }}" = "win-x64" ]; then bootstrap_name="${bootstrap_name}.exe"; fi
          destination=".build/bootstrap-artifacts/${{ matrix.target }}/bootstrap/bin/${{ matrix.target }}"
          mkdir -p "$destination"
          cp ".build/tool-bundles/${{ matrix.target }}/bootstrap/bin/${{ matrix.target }}/${bootstrap_name}" "$destination/"
      - name: Upload runtime metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unica-runtime-metadata-${{ matrix.target }}
          # Разрез поставки: по архиву на артефакт, и у каждого свои
          # метаданные. Имя ядра здесь отобрало бы у выпуска движки.
          path: .build/runtime-assets/${{ matrix.target }}/*-runtime-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload runtime verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unica-runtime-verification-${{ matrix.target }}
          path: .build/runtime-assets/${{ matrix.target }}/asset-verification-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload bootstrap payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unica-bootstrap-${{ matrix.target }}
          path: .build/bootstrap-artifacts/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
      - name: Upload P0 wire evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unica-wire-${{ matrix.target }}
          path: .build/p0-wire
          if-no-files-found: error
          retention-days: 1
      - name: Upload required runtime archive
        if: ${{ matrix.target == 'linux-x64' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unica-runtime-${{ matrix.target }}
          path: .build/runtime-assets/${{ matrix.target }}/*-runtime-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Stage BSP assessment engine
        if: matrix.target == 'linux-x64'
        run: >
          python scripts/ci/stage-unica-assessment-engine.py
          --bundle-root .build/tool-bundles/linux-x64
          --out-archive .build/unica-assessment-engine-linux-x64.tar.gz
          --artifact bsl-analyzer
          --artifact rlm-tools-bsl
      - name: Upload BSP assessment engine
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unica-assessment-engine-linux-x64
          # Zipped workflow artifacts normalize files to 0644. The inner tar
          # keeps the verified executable modes needed by both engines.
          path: .build/unica-assessment-engine-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package-thin:
    name: Package thin marketplace payload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-tools
    if: ${{ always() && needs.build-tools.result == 'success' }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Packaging requires release.tag == v{pluginVersion}, so a non-tag build
      # has to name the version in the tree. Deriving it keeps the version out of
      # this file: a literal here is one more place to bump, and the only one no
      # contract check covers.
      - name: Resolve the release tag for non-tag builds
        if: ${{ env.RELEASE_TAG == '' }}
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("plugins/unica/.codex-plugin/plugin.json"))["version"])')"
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unica-runtime-metadata-*
          path: .build/runtime-metadata
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unica-bootstrap-*
          path: .build/bootstrap-root
          merge-multiple: true
      - run: >
          python scripts/ci/package-unica-plugin.py
          --repo-root .
          --runtime-metadata-root .build/runtime-metadata
          --bootstrap-root .build/bootstrap-root
          --release-tag "$RELEASE_TAG"
          --source-commit "${{ github.sha }}"
          --out-dir dist/thin
      - name: Require both host contracts in the shared plugin directory
        run: |
          test -f dist/thin/marketplace/plugins/unica/.codex-plugin/plugin.json
          test -f dist/thin/marketplace/plugins/unica/.claude-plugin/plugin.json
          test -f dist/thin/marketplace/.agents/plugins/marketplace.json
          test -f dist/thin/marketplace/.claude-plugin/marketplace.json
      # Pinned to the oldest supported client rather than the latest, so the gate
      # tests the compatibility floor the README promises instead of a moving
      # target. 2.1.67 and 2.1.68 reject the catalog's git-subdir source; 2.1.69
      # is the first release that accepts it.
      - name: Validate the Claude plugin and catalog # zizmor: ignore[adhoc-packages] версия закреплена точно и сверяется после установки
        env:
          CLAUDE_CLI_VERSION: 2.1.69
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"
          test "$(claude --version | cut -d' ' -f1)" = "$CLAUDE_CLI_VERSION"
          claude plugin validate dist/thin/marketplace/plugins/unica
          claude plugin validate dist/thin/marketplace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unica-thin-marketplace
          path: dist/thin/marketplace
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unica-p0-package-evidence
          path: dist/thin/p0-package-evidence.json
          if-no-files-found: error
          retention-days: 1

  p0-release-proof:
    name: P0 dry RC/package proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-tools, package-thin, release-assessment]
    if: >-
      ${{
        always() &&
        needs.build-tools.result == 'success' &&
        needs.package-thin.result == 'success' &&
        needs.release-assessment.result == 'success' &&
        github.event_name == 'workflow_dispatch'
      }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unica-wire-*
          path: .build/p0-wire
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unica-runtime-verification-*
          path: .build/p0-assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unica-thin-marketplace
          path: .build/p0-marketplace
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unica-p0-package-evidence
          path: .build/p0-package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unica-release-assessment
          path: .build/release-assessment
      - name: Evaluate read-only P0 proof
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("plugins/unica/.codex-plugin/plugin.json"))["version"])')"
          baseline="$(python -c 'from pathlib import Path; paths=sorted(Path("tests/fixtures/migration").glob("*-baseline.json")); assert len(paths) == 1; print(paths[0])')"
          source_commit="$(git rev-parse HEAD)"
          python scripts/ci/release-proof.py \
            --wire-dir .build/p0-wire \
            --baseline "$baseline" \
            --assessment .build/release-assessment/assessment.json \
            --package .build/p0-package/p0-package-evidence.json \
            --package-dir .build/p0-marketplace \
            --asset-verification-dir .build/p0-assets \
            --source-commit "$source_commit" \
            --release-tag "v$version" \
            --mode dry \
            --out-dir dist/p0-proof
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unica-p0-proof
          path: dist/p0-proof
          if-no-files-found: error
          retention-days: 14

  probe-thin-bootstrap:
    name: Probe thin bootstrap (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: package-thin
    if: >-
      ${{
        always() &&
        needs.package-thin.result == 'success' &&
        github.event_name == 'workflow_dispatch'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: win-x64
            runner: windows-2022
          - target: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unica-thin-marketplace
          path: .build/thin
      - name: Probe packaged bootstrap through the downloader
        run: >
          python scripts/ci/smoke-unica-bootstrap.py
          --plugin-root .build/thin/plugins/unica
          --target "${{ matrix.target }}"
          --expect-download-failure

  release-assessment:
    name: Assess Linux runtime on BSP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [classify-changes, build-tools]
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    if: >-
      ${{
        always() &&
        needs.classify-changes.result == 'success' &&
        needs.build-tools.result == 'success' &&
        (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) &&
        needs.classify-changes.outputs.assessment_required == 'true'
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve the release tag for non-tag builds
        if: ${{ env.RELEASE_TAG == '' }}
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("plugins/unica/.codex-plugin/plugin.json"))["version"])')"
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unica-runtime-linux-x64
          path: dist/runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unica-assessment-engine-linux-x64
          path: .build/assessment-engine
      - name: Run release assessment
        run: >
          python scripts/ci/release-assessment.py
          --package-archive dist/runtime/unica-runtime-linux-x64.tar.gz
          --engine-overlay .build/assessment-engine/unica-assessment-engine-linux-x64.tar.gz
          --work-dir .build/release-assessment
          --out-dir dist/release-assessment
          --bsp-ref 3.2.1.446
          --release-tag "$RELEASE_TAG"
          --github-run-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unica-release-assessment
          path: dist/release-assessment
          if-no-files-found: warn
          retention-days: 1

  publish-release-assets:
    name: Publish runtime assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-tools
    if: >-
      ${{
        always() &&
        needs.build-tools.result == 'success' &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/')
      }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unica-runtime-*
          path: dist/runtime
          merge-multiple: true
      # Джоба идёт только на теге и при перезапуске дописывает ассеты к уже
      # созданному релизу; переход на `gh release` — вместе с репетицией релиза.
      - name: Publish the release assets # zizmor: ignore[superfluous-actions] замена на gh release требует репетиции на теге
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          # Предвыпуск не должен выглядеть последним релизом: его ищут те, кто
          # ищет свежее, а он существует только для замеров.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Выпуск публикует ядро и его описание — их читает
          # `verify-release-assets.py`, перекачивая с релиза. Описания поставок
          # сюда не едут: их читает только упаковщик, и берёт он их из артефакта
          # сборки. На релизе они были бы третьей копией фактов, уже записанных
          # в `tools.lock.json` исходного тега и в `runtime-manifest.json`
          # выложенного плагина, — и обещали бы ассет, которого здесь нет.
          files: |
            dist/runtime/unica-runtime-*.tar.gz
            dist/runtime/unica-runtime-*.json

  smoke-thin-plugin:
    name: Smoke published thin plugin (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [package-thin, publish-release-assets]
    if: >-
      ${{
        always() &&
        needs.package-thin.result == 'success' &&
        needs.publish-release-assets.result == 'success' &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: win-x64
            runner: windows-2022
          - target: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unica-thin-marketplace
          path: .build/thin
      - name: Smoke packaged bootstrap against published runtime
        run: >
          python scripts/ci/smoke-unica-bootstrap.py
          --plugin-root .build/thin/plugins/unica
          --target "${{ matrix.target }}"
      # Ядро выпуск публикует сам, и его байты сверяет `verify-release-assets`.
      # Поставки приезжают из тулчейна, и до этого шага их путь целиком —
      # адрес, сумма, раскладка — в выпуске не проходил никто. Одной цели
      # довольно: адреса остальных проверены отдельно и стоят одного HEAD.
      - name: Prefetch the whole delivery once, end to end
        if: ${{ matrix.target == 'linux-x64' }}
        shell: bash
        env:
          UNICA_RUNTIME_CACHE_DIR: ${{ runner.temp }}/prefetch-cache
        run: |
          set -euo pipefail
          bootstrap=".build/thin/plugins/unica/bootstrap/bin/linux-x64/unica-bootstrap"
          chmod +x "$bootstrap"
          "$bootstrap" prefetch --plugin-root .build/thin/plugins/unica

  verify-published-assets:
    name: Re-download and verify published bytes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - publish-release-assets
      - package-thin
    if: >-
      ${{
        always() &&
        needs.package-thin.result == 'success' &&
        needs.publish-release-assets.result == 'success' &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/')
      }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'unica-runtime-*' --dir published
      - run: python scripts/ci/verify-release-assets.py --asset-dir published --source re-downloaded --report published/asset-verification-re-downloaded.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unica-published-asset-verification
          path: published/asset-verification-re-downloaded.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unica-thin-marketplace
          path: .build/thin
      # Ядро сверено побайтно выше. У поставок из тулчейна байты сверены на
      # сборке, а адрес после неё не трогает никто: опечатка в теге дожила бы
      # до первого вызова движка у пользователя. Проверяются все цели —
      # прогреть на месте можно лишь одну.
      - run: >
          python scripts/ci/verify-delivery-reachable.py
          --plugin-root .build/thin/plugins/unica

  unica-ci:
    name: Unica CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - classify-changes
      - guards
      - test-python
      - test-rust-platforms
      - build-tools
      - package-thin
      - probe-thin-bootstrap
      - release-assessment
      - publish-release-assets
      - smoke-thin-plugin
      - verify-published-assets
      - p0-release-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Evaluate required CI results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci/evaluate-ci-gate.py
