name: Issue 1625 Linux proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify the tested source identity
        run: |
          mkdir -p .build/issue-1625
          git diff --exit-code 7ca46fcfd38051f077a9563a8db7836a37be811b -- crates Cargo.toml Cargo.lock .config
          git rev-parse HEAD | tee .build/issue-1625/diagnostic-commit.txt
          git rev-parse HEAD:crates/unica-coder/src/application/code_intelligence.rs | tee .build/issue-1625/tested-source-blob.txt
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.143
      - name: Exact regression without retries
        run: |
          set -o pipefail
          cargo nextest --version | tee .build/issue-1625/nextest-version.txt
          cargo nextest run --locked -p unica-coder --lib --profile queue --retries 0 -E 'test(/^application::code_intelligence::tests::coordinator_enforces_budget_when_provider_ignores_deadline_and_cancellation$/)' 2>&1 | tee .build/issue-1625/exact.log
      - name: Affected module without retries
        run: |
          set -o pipefail
          cargo nextest run --locked -p unica-coder --lib --profile queue --retries 0 -E 'test(/^application::code_intelligence::tests::/)' 2>&1 | tee .build/issue-1625/module.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue-1625-linux-retries-zero
          path: .build/issue-1625
          retention-days: 7
