# Temporary dispatch-only diagnostic control. No PR/merge/release route.
name: Windows manual-cancel init-flush first observation
on:
  workflow_dispatch:
    inputs:
      case_commit:
        required: true
        type: string
        default: b471028e270826bc03ee163efe91a876d65bbf96
      payload_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Preserve reviewed source bytes before either checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: case
          ref: ${{ inputs.case_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.148
      - name: One exact first attempt; first failure retained
        shell: bash
        env:
          CASE_COMMIT: ${{ inputs.case_commit }}
          PAYLOAD_SHA256: ${{ inputs.payload_manifest_sha256 }}
        run: >-
          python control/scripts/dev/windows-manual-cancel-init-flush/run_candidate.py
          --case case --case-commit "$CASE_COMMIT"
          --results manual-cancel-init-flush-results --payload-manifest-sha256 "$PAYLOAD_SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-manual-cancel-init-flush-first-outcome
          if-no-files-found: error
          retention-days: 7
          path: |
            manual-cancel-init-flush-results/*.json
            manual-cancel-init-flush-results/*.stdout
            manual-cancel-init-flush-results/*.stderr
            manual-cancel-init-flush-results/*.xml
            manual-cancel-init-flush-results/owned-libtest.exe
      - name: Retain actual control source bytes
        if: always()
        shell: bash
        run: |
          mkdir -p manual-cancel-init-flush-control-source
          cp control/.github/workflows/unica-plugin-release.yml manual-cancel-init-flush-control-source/workflow.yml
          cp -R control/scripts/dev/windows-manual-cancel-init-flush manual-cancel-init-flush-control-source/payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-manual-cancel-init-flush-control-source
          if-no-files-found: error
          retention-days: 7
          path: manual-cancel-init-flush-control-source/
