# TEMPORARY PROOF BRANCH ONLY. Never merge this workflow into a product branch.
name: TARGETED Windows handoff proof
run-name: TARGETED Windows handoff proof — ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Dispatch compatibility only; this workflow runs TWO targeted tests, not large CI"
        type: choice
        options: [main, large]
        default: main

permissions:
  contents: read

concurrency:
  group: targeted-windows-handoff-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  PROOF_SCOPE: TARGETED_NOT_FULL_GATE
  PROOF_FILTER: 'test(=infrastructure::platform::process::tests::pending_launch_owner_crash_kills_unreleased_client) | test(=infrastructure::platform::process::tests::released_launch_survives_owner_crash)'

jobs:
  windows-handoff-proof:
    name: TARGETED native Windows — two ownership probes
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.143
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Record exact source and intended scope
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          New-Item -ItemType Directory -Force .build/handoff-proof | Out-Null
          @'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path('.build/handoff-proof')
          def git(*args):
              return subprocess.check_output(['git', *args])
          sha = git('rev-parse', 'HEAD').decode().strip()
          assert sha == os.environ['GITHUB_SHA']
          workflow = '.github/workflows/unica-plugin-release.yml'
          product = b''.join(line for line in git('ls-tree', '-r', '--full-tree', 'HEAD').splitlines(keepends=True) if line.rstrip(b'\n').split(b'\t', 1)[1] != workflow.encode())
          (out / 'product-tree.txt').write_bytes(product)
          record = {
              'scope': 'TARGETED_NOT_FULL_GATE', 'fullGate': False,
              'sourceSha': sha, 'productTreeExceptWorkflowSha256': hashlib.sha256(product).hexdigest(),
              'processSourceBlob': git('rev-parse', 'HEAD:crates/unica-coder/src/infrastructure/platform/process.rs').decode().strip(),
              'workflowBlob': git('rev-parse', 'HEAD:' + workflow).decode().strip(),
              'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'ref': os.environ['GITHUB_REF'], 'runnerOs': os.environ['RUNNER_OS'],
              'requestedDispatchProfile': os.environ['REQUESTED_PROFILE'], 'actualTestProfile': 'queue',
              'filter': os.environ['PROOF_FILTER'], 'retries': 0,
              'runUrl': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          (out / 'metadata.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose | Tee-Object .build/handoff-proof/rustc.txt
          cargo nextest --version | Tee-Object .build/handoff-proof/nextest-version.txt
      - name: Compile and verify the exact two native Windows cases
        id: plan
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo nextest list --locked -p unica-coder --lib --profile queue -E "$env:PROOF_FILTER" --message-format json 2> .build/handoff-proof/list-stderr.log | Set-Content -Encoding utf8 .build/handoff-proof/list.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json, pathlib
          p = pathlib.Path('.build/handoff-proof/list.json')
          data = json.loads(p.read_text(encoding='utf-8-sig'))
          selected = [(name, case) for suite in data['rust-suites'].values() for name, case in suite['testcases'].items() if case.get('filter-match', {}).get('status', 'matches') == 'matches']
          expected = {'infrastructure::platform::process::tests::pending_launch_owner_crash_kills_unreleased_client', 'infrastructure::platform::process::tests::released_launch_survives_owner_crash'}
          assert len(selected) == 2 and {name for name, _ in selected} == expected, selected
          assert not any(case.get('ignored', False) for _, case in selected), selected
          print('Exactly two native Windows cases selected:', sorted(expected))
          '@ | python -
          exit $LASTEXITCODE
      - name: Strict native workspace clippy
        id: lint
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | Tee-Object .build/handoff-proof/clippy.log
          $code = $LASTEXITCODE
          Set-Content .build/handoff-proof/clippy-exit-code.txt $code
          exit $code
      - name: Execute both probes without retries
        id: probes
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo nextest run --locked -p unica-coder --lib --profile queue --retries 0 --no-fail-fast -E "$env:PROOF_FILTER" --success-output immediate --failure-output immediate 2>&1 | Tee-Object .build/handoff-proof/nextest.log
          $code = $LASTEXITCODE
          Set-Content .build/handoff-proof/nextest-exit-code.txt $code
          exit $code
      - name: Record result presence and preserve JUnit
        if: always()
        run: |
          @'
          import json, pathlib, shutil, xml.etree.ElementTree as ET
          out = pathlib.Path('.build/handoff-proof')
          out.mkdir(parents=True, exist_ok=True)
          source = pathlib.Path('target/nextest/queue/junit.xml')
          record = {'scope': 'TARGETED_NOT_FULL_GATE', 'junitPresent': source.is_file()}
          if source.is_file():
              shutil.copyfile(source, out / 'junit.xml')
              cases = list(ET.parse(source).getroot().iter('testcase'))
              record['cases'] = [{'name': c.get('name'), 'classname': c.get('classname'), 'failed': c.find('failure') is not None or c.find('error') is not None, 'skipped': c.find('skipped') is not None} for c in cases]
          else:
              record['reason'] = 'No execution result: inspect compilation, cancellation or earlier step failure; this is not a passing proof.'
          (out / 'result-presence.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, indent=2))
          if source.is_file():
              expected = {'infrastructure::platform::process::tests::pending_launch_owner_crash_kills_unreleased_client', 'infrastructure::platform::process::tests::released_launch_survives_owner_crash'}
              selected = [c for c in cases if c.get('name') in expected]
              assert len(selected) == 2 and {c.get('name') for c in selected} == expected, record
              assert not any(c.find('skipped') is not None for c in selected), record
              # nextest also reports globally ignored helpers outside the filter.
              assert not any(c.get('name') not in expected and c.find('skipped') is None for c in cases), record
          else:
              raise SystemExit('Missing JUnit: targeted execution is unproved')
          '@ | python -
          exit $LASTEXITCODE
      - name: Upload targeted proof evidence, including RED failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: targeted-windows-handoff-${{ github.sha }}-${{ github.run_attempt }}
          path: .build/handoff-proof
          if-no-files-found: error
          retention-days: 14
