# Temporary dispatch-only control; no PR/merge/release path.
name: E961 one-Alpha Windows causal observation
on:
  workflow_dispatch:
    inputs:
      case_commit:
        required: true
        type: string
        default: de78b1f5f407179fb5eb4af63bf8e5da744dd7d7
      payload_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  forensic:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Preserve bytes before either checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.case_commit }}
          path: case
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - name: Exactly one Alpha observation; nonzero forensic outcomes preserved
        shell: bash
        env:
          CASE_COMMIT: ${{ inputs.case_commit }}
          PAYLOAD_SHA256: ${{ inputs.payload_manifest_sha256 }}
        run: >-
          python control/scripts/dev/e961-one-alpha/run_probe.py
          --case case --case-commit "$CASE_COMMIT" --target win-x64
          --results e961-one-alpha-results
          --payload-manifest-sha256 "$PAYLOAD_SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: e961-one-alpha-win-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            e961-one-alpha-results/receipt.json
            e961-one-alpha-results/*.stdout
            e961-one-alpha-results/*.stderr
            e961-one-alpha-results/*.json
            e961-one-alpha-results/*.rs
            e961-one-alpha-results/owned-libtest.exe
            e961-one-alpha-results/owned/owner.json
            e961-one-alpha-results/owned/engines.json
            e961-one-alpha-results/owned/events.jsonl
            e961-one-alpha-results/owned/inner.stdout
            e961-one-alpha-results/owned/inner.stderr
            e961-one-alpha-results/owned/cwd-calibration/
            e961-one-alpha-results/owned/handles/
      - name: Retain actual control source bytes
        if: always()
        shell: bash
        run: |
          mkdir -p e961-one-alpha-control-source
          cp control/.github/workflows/unica-plugin-release.yml e961-one-alpha-control-source/workflow.yml
          cp -R control/scripts/dev/e961-one-alpha e961-one-alpha-control-source/payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: e961-one-alpha-control-source-win-x64
          if-no-files-found: error
          retention-days: 7
          path: e961-one-alpha-control-source/
