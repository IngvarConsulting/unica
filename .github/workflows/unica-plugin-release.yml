# Temporary control ref only. Do not merge this diagnostic workflow into main.
name: Unica 1523 Windows receipt causal diagnostics
on:
  workflow_dispatch:
    inputs:
      case_commit:
        description: Exact reviewed observer commit (root must replace placeholder)
        required: true
        type: string
        default: bc23cc703fcd281d41048349da0beae0848b8c7a
      manifest_sha256:
        description: SHA256 of the frozen control manifest
        required: true
        type: string
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Preserve control and case source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.case_commit }}
          path: case
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - name: Four causal controls, then two original scenarios without retry
        shell: pwsh
        env:
          CASE_COMMIT: ${{ inputs.case_commit }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: >-
          python control/scripts/dev/receipt-causal-diagnostics/run_probe.py
          --case case --case-commit "$env:CASE_COMMIT"
          --manifest-sha256 "$env:MANIFEST_SHA256"
          --results receipt-1523-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: receipt-1523-windows-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            receipt-1523-results/*.json
            receipt-1523-results/*.stdout
            receipt-1523-results/*.stderr
            receipt-1523-results/*.xml
            receipt-1523-results/retained-*.exe
            control/scripts/dev/receipt-causal-diagnostics/manifest.json
            control/scripts/dev/receipt-causal-diagnostics/run_probe.py
