# Replace only the existing unica-plugin-release.yml on a temporary control ref.
# This proposal is NOT EXECUTED. Payload hash is substituted by root after freeze.
name: E961 missing-platform real-engine witness
on:
  workflow_dispatch:
    inputs:
      case_commit:
        required: true
        type: string
        default: de78b1f5f407179fb5eb4af63bf8e5da744dd7d7
      payload_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - name: Preserve source bytes in both checkouts
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.case_commit }}
          path: case
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - name: One observation using reviewed immutable inputs
        shell: bash
        env:
          CASE_COMMIT: ${{ inputs.case_commit }}
          PAYLOAD_SHA256: ${{ inputs.payload_manifest_sha256 }}
          TARGET: ${{ matrix.target }}
        run: >-
          python control/scripts/dev/e961-pinned-compat/run_probe.py
          --case case --case-commit "$CASE_COMMIT" --target "$TARGET"
          --results "e961-results-$TARGET"
          --payload-manifest-sha256 "$PAYLOAD_SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: e961-real-engine-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            e961-results-${{ matrix.target }}/receipt.json
            e961-results-${{ matrix.target }}/*.stdout
            e961-results-${{ matrix.target }}/*.stderr
            e961-results-${{ matrix.target }}/*.json
            e961-results-${{ matrix.target }}/*.rs
            e961-results-${{ matrix.target }}/owned-libtest*
            e961-results-${{ matrix.target }}/owned/owner.json
            e961-results-${{ matrix.target }}/owned/engines.json
            e961-results-${{ matrix.target }}/owned/events.jsonl
            e961-results-${{ matrix.target }}/owned/inner.stdout
            e961-results-${{ matrix.target }}/owned/inner.stderr
      - name: Retain actual control checkout bytes
        if: always()
        shell: bash
        run: |
          mkdir -p e961-control-source
          cp control/.github/workflows/unica-plugin-release.yml e961-control-source/workflow.yml
          cp control/scripts/dev/e961-pinned-compat/manifest.json control/scripts/dev/e961-pinned-compat/pinned_compat.rs control/scripts/dev/e961-pinned-compat/run_probe.py control/scripts/dev/e961-pinned-compat/source-pins.json e961-control-source/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: e961-control-source-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: e961-control-source/
