name: Build Unica Codex Plugin

on:
  # Ручной запуск — полный контур: сборка инструментов, пакет, проба, сухой
  # RC, оценка. Ночь сохраняет имя `large` для истории линии, но исполняет
  # полный small/medium/large через nextest nightly-full и оба Python suites.
  # Старые large-only результаты не являются свидетельством full nightly.
  workflow_dispatch:
    inputs:
      profile:
        description: "Профиль ворот: main — очередь, large — полный nightly small/medium/large"
        type: choice
        options: [main, large]
        default: main
  pull_request:
    # Смена меток не запускает основной workflow: новый suite без `Unica CI`
    # заменяет для ruleset успешный suite той же головы PR. Метка `ci:full`
    # читается из снимка pull request при следующем push (`synchronize`).
    types: [opened, synchronize, reopened]
  # Очередь слияния: прогон на будущем состоянии main пачкой pull request.
  # Здесь ловится то, что отбор по размеру на pull request пропускает.
  merge_group:
    types: [checks_requested]
  # Push в релизную линию — ворота линии: очереди там нет, поэтому полный
  # набор тестов без отбора по файлам и без упаковки; отсюда сайт собирает
  # отчёт линии (`workflow_run` в unica-pages.yml). Push в `main` приходит из
  # очереди, и его дерево уже проверено: тестов здесь нет, Rust-джоба идёт
  # только ради записи кэша зависимостей, когда сменился его ключ или сам
  # конвейер. Упаковка, холодный старт и оценка остаются у тега и кнопки.
  push:
    branches: [main, "release-v*"]
    tags:
      - "v*"

permissions:
  contents: read

# Ворота → профиль исполнителя: pull request — `pr`, очередь слияния —
# `queue`, ручной запуск — что попросили (`main` или `large`), push в ветку
# — `main`, тег — `release`.
env:
  GATE_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'merge_group' && 'queue' || github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && 'release' || 'main' }}

# Ручной и ночной запуск идут своей группой: в общей с push они ждали бы за
# сборкой ветки, а второй push вытеснял бы ожидающий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', inputs.profile) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Запись очереди занимает два раннера: эту Linux-джобу и джобу macOS
  # (`rust-os`). На тарифе с 20 одновременными джобами, из них 5 macOS, так
  # пачка записей не ждёт раннеров. Всё, что раньше шло отдельными джобами, —
  # маршрут, guards, сборки, тесты, Clippy, Python, сверка инвентаря и итог —
  # идёт здесь подряд в одном каталоге `target`: архивы полос не покидают
  # джобу, продукт для Python собирается из тех же зависимостей. `needs` на
  # macOS сделал бы запись последовательной, поэтому в конце джоба ждёт её по
  # jobs API (`await_os_jobs.py`) и забирает её отчёт. У джобы нет `if:`:
  # пропущенную обязательную проверку ruleset засчитал бы как пройденную.
  unica-ci:
    # Стабильное имя обязательной проверки ruleset. Смена метки не запускает
    # этот workflow и потому не создаёт более новый suite без этих ворот.
    name: Unica CI
    runs-on: ubuntu-latest
    # Ночной large исполняет весь набор подряд и ждёт Windows.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'large' && 300 || 120 }}
    # SARIF пишет в Code Scanning; прежний инвентарь и джобы других ОС
    # читаются из Actions, объяснения пропаж инвентаря — из описаний pull
    # request. Права джобы заменяют права workflow целиком.
    # `actions: write` — только чтобы прогон снятой записи очереди отменил себя.
    permissions:
      contents: read
      actions: write
      pull-requests: read
      security-events: write
    outputs:
      rust_changed: ${{ steps.classify.outputs.rust_changed }}
      platform_changed: ${{ steps.classify.outputs.platform_changed }}
      toolchain_changed: ${{ steps.classify.outputs.toolchain_changed }}
      search_integration_changed: ${{ steps.classify.outputs.search_integration_changed }}
      package_changed: ${{ steps.classify.outputs.package_changed }}
      plugin_content_changed: ${{ steps.classify.outputs.plugin_content_changed }}
      ci_changed: ${{ steps.classify.outputs.ci_changed }}
      release_required: ${{ steps.classify.outputs.release_required }}
      assessment_required: ${{ steps.classify.outputs.assessment_required }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      rust_required: ${{ steps.classify.outputs.rust_required }}
      cache_required: ${{ steps.classify.outputs.cache_required }}
      line: ${{ steps.line.outputs.line }}
      runners: ${{ steps.runners.outputs.runners }}
      python_matrix: ${{ steps.python-matrix.outputs.python_matrix }}
      gate_results: ${{ steps.gate.outputs.gate_results }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      PYTHONUTF8: "1"
      REPORT: .build/ci-report
      LANES: .build/ci-lanes
    steps:
      # Очередь, пересобирая пачку, удаляет ref снятой записи, а её прогон
      # остаётся ждать раннеров. Прогон, чей ref уже исчез (404), отменяет себя
      # до занятия второго раннера: его результат никому не нужен. Любой
      # другой ответ API — не повод отменять: лишний прогон дешевле ложной отмены.
      - name: Queue entry still exists
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_REF: ${{ github.ref }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/${QUEUE_REF#refs/}")"
          if [ "$code" != "404" ]; then exit 0; fi
          echo "::warning::$QUEUE_REF больше нет: очередь сняла эту запись, прогон отменяется"
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Классификатор и страж неизменности продукта сравнивают с базой.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Раннеры прогона. Pull request идёт только на Linux; метка `ci:full`,
      # прочитанная при старте прогона, добавляет macOS. Очередь, push в
      # ветку и кнопка — Linux и macOS; в очереди macOS исполняет только
      # платформенные каталоги (профиль nextest `queue-platform`). Windows —
      # только в ночном ярусе `large`: с остальных снят за нестабильность.
      # Известные отказы Windows large — #1523; отдельные регрессии — #1714,
      # #1746, #1776, #1777, #1786. Advisory снимается вместе с ними.
      - id: runners
        env:
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || '' }}
          FULL_MATRIX: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$PROFILE" = "large" ]; then
            echo 'runners=["ubuntu-latest", "macos-14", "windows-latest"]' >> "$GITHUB_OUTPUT"
          elif [ "$FULL_MATRIX" = "true" ]; then
            echo 'runners=["ubuntu-latest", "macos-14"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runners=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
      # Линия прогона едет в подписи результатов: для ветки — она сама, для
      # тега — релизная линия с его коммитом; тег вне релизной линии — отказ.
      - id: line
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "line=$(python scripts/ci/resolve-line.py --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      # Классификатор читает неизменяемые SHA из payload события. Он же
      # определяет обязательные шаги и сохраняет причину docs-only skip
      # отдельно для каждого Rust-раннера; неизвестный diff не сокращает CI.
      - id: classify
        env:
          RUNNERS: ${{ steps.runners.outputs.runners }}
          RUN_LINE: ${{ steps.line.outputs.line }}
        run: python scripts/ci/classify-workflow-changes.py --github-event --runner-matrix "$RUNNERS" --line "$RUN_LINE" --results .build/ci-routing >> "$GITHUB_OUTPUT"
      # Маршрут документации сужает оба Python-набора до small; обычная
      # очередь сохраняет прежний состав. Гейт сверяет этот же список.
      - id: python-matrix
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
        run: echo "python_matrix=$(python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --python-matrix --docs-only "$DOCS_ONLY")" >> "$GITHUB_OUTPUT"
      - if: steps.classify.outputs.docs_only == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-ci-routing
          path: .build/ci-routing
          if-no-files-found: error
          retention-days: 7

      # Guards. Находки zizmor идут в Code Scanning, а не в гейт. С этого
      # места каждый шаг идёт и после красного предыдущего (`!cancelled()`):
      # отказ guards не лишает прогон сборки, тестов и их отчёта.
      - id: guards-compile
        run: |
          python -m py_compile scripts/ci/*.py tests/ci/*.py
          python -m py_compile scripts/dev/*.py tests/dev/*.py
      - id: guards-version
        if: ${{ !cancelled() }}
        run: python scripts/ci/check-version-contract.py
      - if: ${{ !cancelled() }}
        run: python -m pip install -r tests/ci/requirements.txt
      - if: ${{ !cancelled() }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - id: guards-fmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      # Линтер workflow. Версия закреплена; находки гейт не красят — они
      # уходят в Code Scanning, где видны по правилу и строке, и разбираются
      # отдельно. Токен нужен сетевым проверкам: подменённые коммиты, известные
      # уязвимости действий.
      - if: ${{ !cancelled() }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor@1.30.0
      # Отчёты лежат в игнорируемом `.build/`: неотслеживаемый файл в дереве
      # сменил бы отпечаток исходников, к которому привязан продукт для Python.
      - id: guards-zizmor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p .build && zizmor --config .github/zizmor.yml --format sarif --no-exit-codes .github/workflows > .build/zizmor.sarif
      # Токен pull request из форка писать в Code Scanning не вправе; своим
      # веткам и push загрузка доступна. Сбой загрузки (у очереди ветка
      # исчезает после вливания) не красит гейт: это отчёт, не проверка.
      - if: ${{ !cancelled() && hashFiles('.build/zizmor.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: .build/zizmor.sarif
          category: zizmor

      - if: ${{ !cancelled() && (steps.classify.outputs.rust_required == 'true' || steps.classify.outputs.cache_required == 'true') }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: clippy-sarif@0.8.0,sarif-fmt@0.8.0
      # Один ключ зависимостей на ОС для всего, что собирает джоба: архивы
      # полос, продукт для Python и Clippy. Пишут push в ветку и ручной запуск
      # (ночью — large); PR, очередь и тег читают область main. Push в `main`
      # без прогрева кеш не трогает: иначе почти пустой `target` лёг бы под
      # новым точным ключом, а точное попадание уже не пересохраняется.
      - name: Кэш зависимостей Rust # zizmor: ignore[cache-poisoning] только зависимости; пишут push в ветку и ручной запуск, PR, очередь и тег читают область main; поставку собирает build-tools
        if: ${{ !cancelled() && (steps.classify.outputs.rust_required == 'true' || steps.classify.outputs.cache_required == 'true' || (steps.classify.outputs.docs_only != 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main'))) }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust-ordinary
          save-if: ${{ github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          cache-on-failure: true

      # Теневой selector: решение о затронутых пакетах для medium pull request.
      # Обязательный набор он не сокращает. Повторный прогон затронутых тестов
      # ради замера в одной джобе удлинял бы путь до гейта и здесь не идёт.
      - id: shadow
        if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' }}
        run: python scripts/ci/ci_shadow_selector.py --out "$REPORT/ci-shadow/selection.json"
      # Продукт для Python — ordinary binary этой ревизии. Он собирается в тот
      # же `target`, что и архивы, и сразу копируется вне него: сборка Receipt
      # потом пересобирает `unica` со своим признаком.
      - id: product
        if: ${{ !cancelled() && github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && steps.classify.outputs.docs_only != 'true' }}
        run: |
          python scripts/ci/prepared_binary.py build --destination .build/ci-product --target-dir target
          echo "UNICA_PREPARED_BINARY_MANIFEST=$PWD/.build/ci-product/manifest.json" >> "$GITHUB_ENV"
      # Архивы всех полос этого раннера, их планы и doctests. Архив пинует
      # байты, которые перечислил план, к байтам, которые исполнит прогон.
      - id: rust-build
        if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' }}
        env:
          RUN_LINE: ${{ steps.line.outputs.line }}
        run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --phase build --prepared "$LANES" --results "$REPORT" --runner ubuntu-latest --line "$RUN_LINE"
      # Планы выгружаются до тестов: раннер, умерший на середине, оставляет
      # состав, и недошедшие тесты попадут в отчёт `skipped`.
      - id: python-plan
        if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && github.event_name != 'pull_request' }}
        env:
          PYTHON_MATRIX: ${{ steps.python-matrix.outputs.python_matrix }}
          RUN_LINE: ${{ steps.line.outputs.line }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
        run: |
          set -euo pipefail
          while read -r entry; do
            suite="$(jq -r .suite <<<"$entry")"; lane="$(jq -r .lane <<<"$entry")"; slug="$(jq -r .slug <<<"$entry")"
            python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem python --suite "$suite" --only-size "$lane" --docs-only "$DOCS_ONLY" --plan-only --results "$REPORT/plan-python-$slug" --runner ubuntu-latest --line "$RUN_LINE"
          done < <(jq -c '.[]' <<<"$PYTHON_MATRIX")
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-ubuntu-latest
          path: .build/ci-report/plan-*
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
      # Clippy в очереди и на ветках исполняется в фоне, пока идут тесты:
      # компиляция и исполнение тестов вместе занимают раннер плотнее, чем
      # подряд. `cargo` здесь один — прогон архивов его не зовёт. Python с
      # Clippy не пересекается: MCP-тесты под нагрузкой сборки падают по
      # таймауту, поэтому Python идёт после ожидания Clippy. Pull request
      # линтует отдельной джобой `Lint and Python`: так он укладывается в обычное
      # время, а очередь остаётся на двух раннерах.
      - id: clippy-start
        if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' && github.event_name != 'pull_request' }}
        run: python scripts/ci/background_step.py start clippy -- scripts/ci/clippy.sh all
      - id: rust-run
        if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' }}
        env:
          RUN_LINE: ${{ steps.line.outputs.line }}
        run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --phase run --prepared "$LANES" --results "$REPORT" --runner ubuntu-latest --line "$RUN_LINE"
      # Pull request исполняет small; medium затронутых пакетов идёт из того
      # же архива ordinary профилем nextest `queue`. Неизвестный вход, full или
      # сбой selector — весь medium. Обязательная очередь остаётся полной.
      - id: rust-medium
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.classify.outputs.rust_required == 'true' }}
        run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --phase medium --prepared "$LANES" --results "$REPORT" --runner ubuntu-latest --shadow "$REPORT/ci-shadow/selection.json"
      - id: clippy
        if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' && github.event_name != 'pull_request' }}
        run: python scripts/ci/background_step.py wait clippy
      # Категория сохраняет прежнее имя `clippy-ubuntu-latest`, чтобы не
      # потерять историю оповещений.
      - if: always() && hashFiles('.build/clippy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: .build/clippy.sarif
          category: clippy-ubuntu-latest
      # Python не идёт параллельно с Rust и Clippy: MCP-тесты ждут ответа по
      # таймауту и под нагрузкой сборки и nextest падают. Наборы Python идут
      # параллельно друг другу тем же швом, что и раньше джобами: каждый
      # в своём процессе и каталоге результатов, их нагрузка — ожидание
      # процессов продукта, а не компиляция. Красный набор не отменяет
      # остальные; вывод каждого печатается своей группой.
      - id: python
        if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && github.event_name != 'pull_request' }}
        env:
          PYTHON_MATRIX: ${{ steps.python-matrix.outputs.python_matrix }}
          RUN_LINE: ${{ steps.line.outputs.line }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
        run: |
          set -uo pipefail
          slugs=(); pids=(); failed=()
          while read -r entry; do
            suite="$(jq -r .suite <<<"$entry")"; lane="$(jq -r .lane <<<"$entry")"; slug="$(jq -r .slug <<<"$entry")"
            results="$REPORT/results-python-$slug"
            mkdir -p "$results"
            cp -R "$REPORT/plan-python-$slug/." "$results/"
            python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem python --suite "$suite" --only-size "$lane" --docs-only "$DOCS_ONLY" --results "$results" --runner ubuntu-latest --line "$RUN_LINE" > ".build/python-$slug.log" 2>&1 &
            slugs+=("$slug"); pids+=("$!")
          done < <(jq -c '.[]' <<<"$PYTHON_MATRIX")
          for index in "${!pids[@]}"; do
            wait "${pids[$index]}" || failed+=("${slugs[$index]}")
            echo "::group::Python ${slugs[$index]}"
            cat ".build/python-${slugs[$index]}.log"
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::Python не проходят: ${failed[*]}"
            exit 1
          fi
      # Clippy и Python pull request — шаги джобы `Lint and Python` этого
      # прогона: каждый своей записью гейта.
      - id: lint-job
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.classify.outputs.rust_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/await_os_jobs.py --runners '["ubuntu-latest"]' --job "Lint and Python::Clippy" --out .build/lint-job.json --timeout 3600 --require-success
      - id: pr-python
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/await_os_jobs.py --runners '["ubuntu-latest"]' --job "Lint and Python::Python" --out .build/pr-python.json --timeout 3600 --require-success
      # Джобы других ОС этого прогона: их исход и отчёт. Пока они не
      # закончились, Linux ждёт; не дождались за час — `timed_out`.
      - id: os-jobs
        if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && steps.runners.outputs.runners != '["ubuntu-latest"]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNERS: ${{ steps.runners.outputs.runners }}
          # Ждать не дольше джобы ОС: час в воротах, три с запасом ночью.
          WAIT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'large' && 11400 || 3600 }}
        run: python scripts/ci/await_os_jobs.py --runners "$RUNNERS" --out .build/os-jobs.json --timeout "$WAIT_SECONDS"
      - if: ${{ !cancelled() && steps.os-jobs.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{plan,results}-{macos-14,windows-latest}"
          path: .build/ci-report/os-runners
      # Прежний инвентарь — артефакт прогона ближайшего first-parent предка.
      # Сбой поиска базы не скрывает сверку полноты: verify тогда краснеет
      # причиной «план не сравнён с прежним инвентарём».
      - name: Find the previous Rust inventory
        if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/rust_inventory_baseline.py --profile "$GATE_PROFILE" --out .build/ci-baseline/baseline.json
      - id: verify
        if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' }}
        env:
          RUNNERS: ${{ steps.runners.outputs.runners }}
        run: |
          set -euo pipefail
          if [ -f .build/os-jobs.json ]; then CI_JOB_RESULTS="$(cat .build/os-jobs.json)"; else CI_JOB_RESULTS='{}'; fi
          export CI_JOB_RESULTS
          python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --phase verify --runners "$RUNNERS" --sha "$GITHUB_SHA" --results "$REPORT" --baseline .build/ci-baseline/baseline.json
      # Pull request не сравнивает отдельные кейсы с базой очереди: отбор
      # профилей разный. Снятый тест без строки `Removes-test` в описании
      # ловится здесь по diff против первого родителя merge-коммита,
      # а не падением пачки очереди.
      - name: Removed Rust tests are declared
        id: removed-tests
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.classify.outputs.rust_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/removed_tests.py --base HEAD^1
      - if: ${{ always() && steps.classify.outputs.rust_required == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-rust-inventory-verification
          path: |
            .build/ci-report/verification.json
            .build/ci-report/inventory.json
            .build/ci-report/ci-rust-medium/medium.json
          retention-days: 7
          overwrite: true
          if-no-files-found: warn
      # Базу следующих прогонов публикует только проверенный инвентарь
      # очереди, ветки, тега или ручного запуска; pull request сверяется с main.
      - if: ${{ success() && steps.verify.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-rust-inventory-${{ env.GATE_PROFILE }}
          path: .build/ci-report/inventory.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error
      # Push в `main` тестов не гоняет: дерево проверила очередь. При смене
      # CI или toolchain он компилирует те же варианты, что собирает очередь,
      # и пишет ключ зависимостей. Тесты и анализатор не запускаются.
      - id: warm
        if: ${{ !cancelled() && steps.classify.outputs.cache_required == 'true' }}
        run: |
          set -euo pipefail
          target="$(rustc -vV | sed -n 's/^host: //p')"
          cargo test --workspace --no-run --locked --target "$target"
          cargo test -p unica-coder --features receipt-ledger-test-support --test daemon_receipt_ledger --no-run --locked --target "$target"
          cargo build -p unica-coder --bin unica --locked --target "$target"
          cargo check --workspace --all-targets --all-features --locked
      # Результаты едут и при красном прогоне: ради них он и шёл.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-ubuntu-latest
          path: .build/ci-report/results-*
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
      - id: gate
        name: Evaluate required CI results
        if: always()
        env:
          GATE_SCOPE: validation
          STEPS_JSON: ${{ toJSON(steps) }}
          OS_JOBS_FILE: .build/os-jobs.json
          RUNNERS: ${{ steps.runners.outputs.runners }}
          PYTHON_MATRIX: ${{ steps.python-matrix.outputs.python_matrix }}
        run: python scripts/ci/evaluate-ci-gate.py

  # Clippy и Python pull request: вторая Linux-джоба рядом с `Unica CI`,
  # которая ждёт исход её шагов по jobs API (`lint-job`, `pr-python`). Python
  # small продукту не нужен, поэтому он идёт здесь, параллельно сборке и
  # medium. Только pull request: очередь и ветки исполняют всё внутри
  # `Unica CI` и держат два раннера на запись.
  pr-checks:
    name: Lint and Python
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # SARIF Clippy пишет в Code Scanning.
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      PYTHONUTF8: "1"
      REPORT: .build/ci-report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: line
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "line=$(python scripts/ci/resolve-line.py --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      # Маршрут — тот же классификатор: без Rust линтовать нечего, документация
      # сужает Python до small.
      - id: classify
        env:
          RUN_LINE: ${{ steps.line.outputs.line }}
        run: |
          set -euo pipefail
          mkdir -p .build
          python scripts/ci/classify-workflow-changes.py --github-event --runner-matrix '["ubuntu-latest"]' --line "$RUN_LINE" --results .build/ci-routing-pr >> "$GITHUB_OUTPUT"
      - id: python-matrix
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
        run: echo "python_matrix=$(python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --python-matrix --docs-only "$DOCS_ONLY")" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -r tests/ci/requirements.txt
      # Python small читает манифесты через `cargo metadata`; Clippy — компоненту.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - if: steps.classify.outputs.rust_required == 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: clippy-sarif@0.8.0,sarif-fmt@0.8.0
      # Только чтение: pull request ключ не пишет.
      - name: Кэш зависимостей Rust # zizmor: ignore[cache-poisoning] restore-only; PR читает область main, джоба публикует только SARIF и отчёт Python
        if: steps.classify.outputs.rust_required == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust-ordinary
          save-if: false
      # Python и Clippy делят раннер, но не по очереди: Python идёт первым,
      # пока компиляции нет, — MCP-тесты под нагрузкой сборки падают.
      - name: Python
        id: python
        env:
          PYTHON_MATRIX: ${{ steps.python-matrix.outputs.python_matrix }}
          RUN_LINE: ${{ steps.line.outputs.line }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
        run: |
          set -uo pipefail
          slugs=(); pids=(); failed=()
          while read -r entry; do
            suite="$(jq -r .suite <<<"$entry")"; lane="$(jq -r .lane <<<"$entry")"; slug="$(jq -r .slug <<<"$entry")"
            results="$REPORT/results-python-$slug"
            python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem python --suite "$suite" --only-size "$lane" --docs-only "$DOCS_ONLY" --plan-only --results "$results" --runner ubuntu-latest --line "$RUN_LINE" || failed+=("$slug-plan")
            python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem python --suite "$suite" --only-size "$lane" --docs-only "$DOCS_ONLY" --results "$results" --runner ubuntu-latest --line "$RUN_LINE" > ".build/python-$slug.log" 2>&1 &
            slugs+=("$slug"); pids+=("$!")
          done < <(jq -c '.[]' <<<"$PYTHON_MATRIX")
          for index in "${!pids[@]}"; do
            wait "${pids[$index]}" || failed+=("${slugs[$index]}")
            echo "::group::Python ${slugs[$index]}"
            cat ".build/python-${slugs[$index]}.log"
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::Python не проходят: ${failed[*]}"
            exit 1
          fi
      - name: Clippy
        id: clippy
        if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' }}
        run: scripts/ci/clippy.sh all
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-pr-python
          path: .build/ci-report/results-*
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
      # Категория сохраняет прежнее имя `clippy-ubuntu-latest`, чтобы не
      # потерять историю оповещений.
      - if: always() && hashFiles('.build/clippy.sarif') != '' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: .build/clippy.sarif
          category: clippy-ubuntu-latest

  # Остальные раннеры прогона. Очередь — macOS с платформенными каталогами
  # (`queue-platform`); push в релизную ветку, кнопка, тег и ночь — полный
  # macOS с Clippy, ночью ещё Windows (advisory, #1523). Pull request —
  # только с меткой `ci:full`. Push в `main` её не запускает: ключ
  # зависимостей macOS пишет ночь, а прогоны берут ближайший по префиксу.
  # Маршрут джоба считает тем же классификатором; расхождение с маршрутом
  # `Unica CI` сверка видит как пропавшую конфигурацию, а `os-job.json`
  # оставляет его в отчёте для разбора.
  rust-os:
    name: Rust (${{ matrix.runner }})
    # Чтение исходников; `actions: write` — только для самоотмены снятой записи очереди.
    permissions:
      contents: read
      actions: write
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'large' && 180 || 60 }}
    # Windows advisory до устранения известных отказов large (#1523).
    continue-on-error: ${{ matrix.runner == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.profile == 'large' && '["macos-14", "windows-latest"]' || '["macos-14"]') }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      MATRIX_RUNNER: ${{ matrix.runner }}
      PYTHONUTF8: "1"
      REPORT: .build/ci-report
      LANES: .build/ci-lanes
    steps:
      # Очередь, пересобирая пачку, удаляет ref снятой записи, а её прогон
      # остаётся ждать раннеров. Прогон, чей ref уже исчез (404), отменяет себя
      # до занятия второго раннера: его результат никому не нужен. Любой
      # другой ответ API — не повод отменять: лишний прогон дешевле ложной отмены.
      - name: Queue entry still exists
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_REF: ${{ github.ref }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/${QUEUE_REF#refs/}")"
          if [ "$code" != "404" ]; then exit 0; fi
          echo "::warning::$QUEUE_REF больше нет: очередь сняла эту запись, прогон отменяется"
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: line
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "line=$(python scripts/ci/resolve-line.py --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - id: classify
        env:
          RUN_LINE: ${{ steps.line.outputs.line }}
        run: |
          set -euo pipefail
          mkdir -p .build
          python scripts/ci/classify-workflow-changes.py --github-event --runner-matrix "[\"$MATRIX_RUNNER\"]" --line "$RUN_LINE" --results .build/ci-routing-os > .build/classification.txt
          cat .build/classification.txt >> "$GITHUB_OUTPUT"
          mkdir -p "$REPORT"
          python - "$REPORT/os-job.json" <<'PY'
          import json, os, sys
          values = dict(line.split("=", 1) for line in open(".build/classification.txt", encoding="utf-8").read().splitlines() if "=" in line)
          json.dump({"runner": os.environ["MATRIX_RUNNER"], "sha": os.environ["GITHUB_SHA"], "profile": os.environ["GATE_PROFILE"],
                     "classification": values}, open(sys.argv[1], "w", encoding="utf-8"), indent=2)
          PY
      - if: steps.classify.outputs.rust_required == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - if: steps.classify.outputs.rust_required == 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Кэш зависимостей Rust # zizmor: ignore[cache-poisoning] только зависимости; пишут push в ветку и ручной запуск, PR, очередь и тег читают область main; поставку собирает build-tools
        if: steps.classify.outputs.rust_required == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust-ordinary
          save-if: ${{ github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          cache-on-failure: true
      - id: rust-build
        if: steps.classify.outputs.rust_required == 'true'
        env:
          RUN_LINE: ${{ steps.line.outputs.line }}
        run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --phase build --prepared "$LANES" --results "$REPORT" --runner "$MATRIX_RUNNER" --line "$RUN_LINE"
      - if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ matrix.runner }}
          path: .build/ci-report/plan-*
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
      - id: rust-run
        if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' }}
        env:
          RUN_LINE: ${{ steps.line.outputs.line }}
        run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --phase run --prepared "$LANES" --results "$REPORT" --runner "$MATRIX_RUNNER" --line "$RUN_LINE"
      # Полный контур линтует и эту ОС: ветки `cfg` по ОС. Очередь с одними
      # платформенными каталогами линтует macOS ночью и на теге.
      - if: ${{ !cancelled() && steps.classify.outputs.rust_required == 'true' && env.GATE_PROFILE != 'queue' }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.runner }}
          path: |
            .build/ci-report/results-*
            .build/ci-report/os-job.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  build-tools:
    name: Build tools (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: [unica-ci, rust-os]
    if: >-
      ${{
        always() &&
        needs.unica-ci.result == 'success' &&
        needs.rust-os.result == 'success' &&
        (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) &&
        (needs.unica-ci.outputs.release_required == 'true' ||
         needs.unica-ci.outputs.ci_changed == 'true')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: win-x64
            runner: windows-latest
          - target: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check bootstrap smoke process cleanup on Windows
        if: matrix.target == 'win-x64'
        run: python -m unittest tests.ci.test_smoke_unica_bootstrap
      - if: matrix.target == 'win-x64'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # package.json здесь нет: кэшу пакетов нечего хранить, а в релизном
          # контуре его и не должно быть.
          package-manager-cache: false
      - name: Install pinned Codex CLI on Windows # zizmor: ignore[adhoc-packages] версия закреплена точно и сверяется после установки
        if: matrix.target == 'win-x64'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @openai/codex@0.145.0-alpha.18
          test "$(codex --version)" = "codex-cli 0.145.0-alpha.18"
      - id: rust-toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      # Сборка тега читает только кэш, записанный прогонами main; pull request
      # пишет лишь в свою область и до релизной сборки не дотягивается.
      - id: cargo-cache # zizmor: ignore[cache-poisoning] кэш пишут только прогоны main, pull request в их область не пишет
        name: Restore Cargo target cache
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/tool-work/${{ matrix.target }}/cargo-target
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
      - name: Build target bundle and bootstrap
        if: matrix.target != 'win-x64'
        run: >
          python scripts/ci/build-unica-tools.py
          --repo-root .
          --target "${{ matrix.target }}"
          --lock-file plugins/unica/third-party/tools.lock.json
          --out-dir ".build/tool-bundles/${{ matrix.target }}"
          --work-dir .build/tool-work
          --metrics-file ".build/cargo-metrics/${{ matrix.target }}.json"
      - name: Build, install, and verify local development on Windows
        if: matrix.target == 'win-x64'
        shell: bash
        run: |
          set -euo pipefail
          build_root="$PWD/.build"
          codex_home="$(cygpath -m "$build_root/codex-home")"
          CODEX_HOME="$codex_home" \
            scripts/dev/install-local-unica.sh \
              --build-dir "$build_root"

          bundle_manifest="$(find "$build_root/tool-artifacts" \
            -mindepth 2 -maxdepth 2 -name tools.json -print -quit)"
          if [ -z "$bundle_manifest" ]; then
            echo "local installer did not produce a tool bundle" >&2
            exit 66
          fi
          bundle_root="$(dirname "$bundle_manifest")"
          mkdir -p "$PWD/.build/tool-bundles"
          rm -rf "$PWD/.build/tool-bundles/win-x64"
          cp -R "$bundle_root" "$PWD/.build/tool-bundles/win-x64"
      - name: Report Cargo cache and build metrics
        if: always()
        shell: bash
        env:
          CACHE_STEP_OUTCOME: ${{ steps.cargo-cache.outcome }}
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          METRICS_FILE: .build/cargo-metrics/${{ matrix.target }}.json
          TARGET: ${{ matrix.target }}
        run: |
          set -u
          cache_outcome=miss
          if [ "$CACHE_STEP_OUTCOME" != "success" ]; then
            cache_outcome=error
          elif [ "$CACHE_HIT" = "true" ]; then
            cache_outcome=exact-hit
          fi
          cargo_seconds="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["cargoBuildSeconds"])' "$METRICS_FILE" 2>/dev/null || true)"
          if [ -z "$cargo_seconds" ]; then cargo_seconds=unavailable; fi
          archive_download_seconds="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["archiveDownloadSeconds"])' "$METRICS_FILE" 2>/dev/null || true)"
          if [ -z "$archive_download_seconds" ]; then archive_download_seconds=unavailable; fi
          {
            echo "### Cargo build ($TARGET)"
            echo
            echo "- Target: \`$TARGET\`"
            echo "- Cache outcome: \`$cache_outcome\`"
            echo "- Cargo build duration: \`$cargo_seconds\` seconds"
            echo "- RLM archive download duration: \`$archive_download_seconds\` seconds"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check bundled tool contracts
        run: >
          python scripts/ci/check-tool-contracts.py
          --target "${{ matrix.target }}"
          --tools-dir ".build/tool-bundles/${{ matrix.target }}/bin/${{ matrix.target }}"
      - name: Package deterministic runtime
        run: >
          python scripts/ci/package-unica-runtime.py
          --bundle-root ".build/tool-bundles/${{ matrix.target }}"
          --out-dir ".build/runtime-assets/${{ matrix.target }}"
      - name: Verify local runtime asset pair
        run: >
          python scripts/ci/verify-release-assets.py
          --asset-dir ".build/runtime-assets/${{ matrix.target }}"
          --target "${{ matrix.target }}"
          --source local-build
          --report ".build/runtime-assets/${{ matrix.target }}/asset-verification-${{ matrix.target }}.json"
      - name: Report standalone runtime size evidence
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLE_ROOT: .build/tool-bundles/${{ matrix.target }}
          WORK_ROOT: .build/tool-work/${{ matrix.target }}
          ASSET_ROOT: .build/runtime-assets/${{ matrix.target }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import tarfile
          from pathlib import Path

          target = os.environ["TARGET"]
          lock = json.loads(
              Path("plugins/unica/third-party/tools.lock.json").read_text(encoding="utf-8")
          )
          rlm_tools = [
              tool
              for tool in lock["tools"]
              if tool["name"] in {"rlm-bsl-index", "rlm-bsl-mcp"}
          ]
          assets = [tool["assets"][target] for tool in rlm_tools]
          asset_names = {asset["assetName"] for asset in assets}
          asset_sizes = {asset["size"] for asset in assets}
          if len(rlm_tools) != 2 or len(asset_names) != 1 or len(asset_sizes) != 1:
              raise SystemExit("RLM archive lock identity is not shared")
          asset_name = next(iter(asset_names))
          expected_archive_bytes = next(iter(asset_sizes))
          matches = sorted(Path(os.environ["WORK_ROOT"]).joinpath("downloads").glob(f"*-{asset_name}"))
          if len(matches) != 1:
              raise SystemExit(f"expected one downloaded RLM archive, found {len(matches)}")
          source_archive = matches[0]
          if source_archive.stat().st_size != expected_archive_bytes:
              raise SystemExit("downloaded RLM archive size differs from lock")
          with tarfile.open(source_archive, "r:gz") as archive:
              stream = archive.extractfile("manifest.json")
              if stream is None:
                  raise SystemExit("RLM archive manifest is missing")
              rlm_manifest = json.load(stream)
          extracted_rlm_bytes = sum(item["size"] for item in rlm_manifest["files"])

          tools_path = Path(os.environ["BUNDLE_ROOT"]) / "tools.json"
          manifest = json.loads(tools_path.read_text(encoding="utf-8"))
          runtime_file_count = len(manifest["runtimeFiles"])
          runtime_archive = (
              Path(os.environ["ASSET_ROOT"]) / f"unica-runtime-{target}.tar.gz"
          )
          final_runtime_bytes = runtime_archive.stat().st_size
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"### Standalone runtime size ({target})\n\n")
              summary.write(f"- RLM source archive bytes: `{source_archive.stat().st_size}`\n")
              summary.write(f"- RLM extracted payload bytes: `{extracted_rlm_bytes}`\n")
              summary.write(f"- Final runtime archive bytes: `{final_runtime_bytes}`\n")
              summary.write(f"- Runtime file count: `{runtime_file_count}`\n")
          PY
      - name: Extract deterministic runtime for MCP smoke
        shell: bash
        run: |
          set -euo pipefail
          runtime_root=".build/runtime-smoke/${{ matrix.target }}"
          mkdir -p "$runtime_root"
          tar -xzf ".build/runtime-assets/${{ matrix.target }}/unica-runtime-${{ matrix.target }}.tar.gz" \
            -C "$runtime_root"
          # Этот смоук проверяет сам runtime и требует настоящий поиск. Тонкое
          # ядро движков не несёт, поэтому прямому запуску явно даём проверенные
          # файлы той же target-сборки. Доставку проверяют bootstrap-пробы.
          cp -R ".build/tool-bundles/${{ matrix.target }}/bin/${{ matrix.target }}/." \
            "$runtime_root/bin/${{ matrix.target }}/"
      - name: Verify Windows Job Object root and child cleanup
        if: matrix.target == 'win-x64'
        shell: bash
        timeout-minutes: 1
        run: >-
          python tests/ci/test_smoke_unica_mcp.py
          SmokeUnicaMcpTests.test_windows_job_object_reaps_root_and_child
      - name: Smoke packaged Unica MCP
        shell: bash
        timeout-minutes: 3
        run: |
          runtime_root=".build/runtime-smoke/${{ matrix.target }}"
          executable="$runtime_root/bin/${{ matrix.target }}/unica"
          if [ "${{ matrix.target }}" = "win-x64" ]; then executable="${executable}.exe"; fi
          python scripts/ci/smoke-unica-mcp.py \
            --binary "$executable" \
            --plugin-root "$runtime_root" \
            --total-timeout-seconds 120
      - name: Probe native package wire profile
        shell: bash
        env:
          UNICA_PROVIDER_STATE_DIR: ${{ runner.temp }}/unica-p0-${{ matrix.target }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          executable=".build/tool-bundles/$TARGET/bin/$TARGET/unica"
          if [ "$TARGET" = "win-x64" ]; then executable="${executable}.exe"; fi
          python scripts/ci/probe-unica-wire.py \
            --binary "$executable" \
            --protocol-version 2026-07-28 \
            --tasks-capability on \
            --profile native \
            --target "$TARGET" \
            --output ".build/p0-wire/native-$TARGET.json"
      - name: Probe compatibility package wire profile
        shell: bash
        env:
          UNICA_PROVIDER_STATE_DIR: ${{ runner.temp }}/unica-p0-${{ matrix.target }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          executable=".build/tool-bundles/$TARGET/bin/$TARGET/unica"
          if [ "$TARGET" = "win-x64" ]; then executable="${executable}.exe"; fi
          python scripts/ci/probe-unica-wire.py \
            --binary "$executable" \
            --protocol-version 2025-06-18 \
            --tasks-capability off \
            --profile compatibility \
            --target "$TARGET" \
            --output ".build/p0-wire/compatibility-$TARGET.json"
      - name: Stage exact bootstrap payload
        shell: bash
        run: |
          bootstrap_name=unica-bootstrap
          if [ "${{ matrix.target }}" = "win-x64" ]; then bootstrap_name="${bootstrap_name}.exe"; fi
          destination=".build/bootstrap-artifacts/${{ matrix.target }}/bootstrap/bin/${{ matrix.target }}"
          mkdir -p "$destination"
          cp ".build/tool-bundles/${{ matrix.target }}/bootstrap/bin/${{ matrix.target }}/${bootstrap_name}" "$destination/"
      # Побочные артефакты сборки носят имена вне `unica-runtime-*`: этим
      # паттерном публикация выпуска забирает архивы ядра, и совпадать с ним
      # должны только они (#701).
      - name: Upload runtime metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unica-metadata-${{ matrix.target }}
          # Разрез поставки: по архиву на артефакт, и у каждого свои
          # метаданные. Имя ядра здесь отобрало бы у выпуска движки.
          path: .build/runtime-assets/${{ matrix.target }}/*-runtime-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload runtime verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unica-asset-verification-${{ matrix.target }}
          path: .build/runtime-assets/${{ matrix.target }}/asset-verification-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload bootstrap payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unica-bootstrap-${{ matrix.target }}
          path: .build/bootstrap-artifacts/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
      - name: Upload P0 wire evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unica-wire-${{ matrix.target }}
          path: .build/p0-wire
          if-no-files-found: error
          retention-days: 1
      - name: Upload required runtime archive
        if: ${{ matrix.target == 'linux-x64' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unica-runtime-${{ matrix.target }}
          path: .build/runtime-assets/${{ matrix.target }}/*-runtime-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Stage BSP assessment engine
        if: matrix.target == 'linux-x64'
        run: >
          python scripts/ci/stage-unica-assessment-engine.py
          --bundle-root .build/tool-bundles/linux-x64
          --out-archive .build/unica-assessment-engine-linux-x64.tar.gz
          --artifact bsl-analyzer
          --artifact rlm-tools-bsl
      - name: Upload BSP assessment engine
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unica-assessment-engine-linux-x64
          # Zipped workflow artifacts normalize files to 0644. The inner tar
          # keeps the verified executable modes needed by both engines.
          path: .build/unica-assessment-engine-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package-thin:
    name: Package thin marketplace payload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-tools
    if: ${{ always() && needs.build-tools.result == 'success' }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Packaging requires release.tag == v{pluginVersion}, so a non-tag build
      # has to name the version in the tree. Deriving it keeps the version out of
      # this file: a literal here is one more place to bump, and the only one no
      # contract check covers.
      - name: Resolve the release tag for non-tag builds
        if: ${{ env.RELEASE_TAG == '' }}
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("plugins/unica/.codex-plugin/plugin.json"))["version"])')"
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unica-metadata-*
          path: .build/runtime-metadata
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unica-bootstrap-*
          path: .build/bootstrap-root
          merge-multiple: true
      - run: >
          python scripts/ci/package-unica-plugin.py
          --repo-root .
          --runtime-metadata-root .build/runtime-metadata
          --bootstrap-root .build/bootstrap-root
          --release-tag "$RELEASE_TAG"
          --source-commit "${{ github.sha }}"
          --out-dir dist/thin
      - name: Require all three host contracts in the shared plugin directory
        run: |
          test -f dist/thin/marketplace/plugins/unica/.codex-plugin/plugin.json
          test -f dist/thin/marketplace/plugins/unica/.claude-plugin/plugin.json
          test -f dist/thin/marketplace/plugins/unica/.zcode-plugin/plugin.json
          test -f dist/thin/marketplace/.agents/plugins/marketplace.json
          test -f dist/thin/marketplace/.claude-plugin/marketplace.json
      # Pinned to the oldest supported client rather than the latest, so the gate
      # tests the compatibility floor the README promises instead of a moving
      # target. 2.1.67 and 2.1.68 reject the catalog's git-subdir source; 2.1.69
      # is the first release that accepts it.
      - name: Validate the Claude plugin and catalog # zizmor: ignore[adhoc-packages] версия закреплена точно и сверяется после установки
        env:
          CLAUDE_CLI_VERSION: 2.1.69
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"
          test "$(claude --version | cut -d' ' -f1)" = "$CLAUDE_CLI_VERSION"
          claude plugin validate dist/thin/marketplace/plugins/unica
          claude plugin validate dist/thin/marketplace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unica-thin-marketplace
          path: dist/thin/marketplace
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unica-p0-package-evidence
          path: dist/thin/p0-package-evidence.json
          if-no-files-found: error
          retention-days: 1

  p0-release-proof:
    name: P0 dry RC/package proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-tools, package-thin, release-assessment]
    if: >-
      ${{
        always() &&
        needs.build-tools.result == 'success' &&
        needs.package-thin.result == 'success' &&
        needs.release-assessment.result == 'success' &&
        github.event_name == 'workflow_dispatch'
      }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unica-wire-*
          path: .build/p0-wire
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unica-asset-verification-*
          path: .build/p0-assets
          merge-multiple: true
      # Идентичность пакета включает бит исполнения (#700), а
      # actions/download-artifact режимы не сохраняет: после него все файлы
      # 644. `gh run download` применяет атрибуты из zip и отдаёт bootstrap
      # исполняемым — тем же путём пакет уезжает в маркетплейс, где дерево
      # держит 100755. Для чтения артефактов своего же прогона джобе нужно
      # `actions: read`; на запись прав по-прежнему нет.
      - name: Download the thin payload with its file modes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name unica-thin-marketplace --dir .build/p0-marketplace
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unica-p0-package-evidence
          path: .build/p0-package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unica-release-assessment
          path: .build/release-assessment
      - name: Evaluate read-only P0 proof
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("plugins/unica/.codex-plugin/plugin.json"))["version"])')"
          baseline="$(python -c 'from pathlib import Path; paths=sorted(Path("tests/fixtures/migration").glob("*-baseline.json")); assert len(paths) == 1; print(paths[0])')"
          source_commit="$(git rev-parse HEAD)"
          python scripts/ci/release-proof.py \
            --surface-ledger docs/tool-surface.md \
            --wire-dir .build/p0-wire \
            --baseline "$baseline" \
            --assessment .build/release-assessment/assessment.json \
            --package .build/p0-package/p0-package-evidence.json \
            --package-dir .build/p0-marketplace \
            --asset-verification-dir .build/p0-assets \
            --source-commit "$source_commit" \
            --release-tag "v$version" \
            --out-dir dist/p0-proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unica-p0-proof
          path: dist/p0-proof
          if-no-files-found: error
          retention-days: 14

  probe-thin-bootstrap:
    name: Probe thin bootstrap (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: package-thin
    if: >-
      ${{
        always() &&
        needs.package-thin.result == 'success' &&
        github.event_name == 'workflow_dispatch'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: win-x64
            runner: windows-2022
          - target: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unica-thin-marketplace
          path: .build/thin
      - name: Probe packaged bootstrap through the downloader
        run: >
          python scripts/ci/smoke-unica-bootstrap.py
          --plugin-root .build/thin/plugins/unica
          --target "${{ matrix.target }}"
          --expect-download-failure

  release-assessment:
    name: Assess Linux runtime on BSP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [unica-ci, build-tools]
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    if: >-
      ${{
        always() &&
        needs.unica-ci.result == 'success' &&
        needs.build-tools.result == 'success' &&
        (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) &&
        needs.unica-ci.outputs.assessment_required == 'true'
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve the release tag for non-tag builds
        if: ${{ env.RELEASE_TAG == '' }}
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("plugins/unica/.codex-plugin/plugin.json"))["version"])')"
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unica-runtime-linux-x64
          path: dist/runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unica-assessment-engine-linux-x64
          path: .build/assessment-engine
      - name: Run release assessment
        run: >
          python scripts/ci/release-assessment.py
          --package-archive dist/runtime/unica-runtime-linux-x64.tar.gz
          --engine-overlay .build/assessment-engine/unica-assessment-engine-linux-x64.tar.gz
          --work-dir .build/release-assessment
          --out-dir dist/release-assessment
          --bsp-ref 3.2.1.446
          --release-tag "$RELEASE_TAG"
          --github-run-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unica-release-assessment
          path: dist/release-assessment
          if-no-files-found: warn
          retention-days: 1

  publish-release-assets:
    name: Publish runtime assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-tools
    if: >-
      ${{
        always() &&
        needs.build-tools.result == 'success' &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/')
      }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unica-runtime-*
          path: dist/runtime
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unica-metadata-*
          path: dist/metadata
          merge-multiple: true
      - name: Pair core archives with their metadata
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-arm64 linux-x64 win-x64; do
            test -f "dist/runtime/unica-runtime-${target}.tar.gz"
            test -f "dist/metadata/unica-runtime-${target}.json"
            cp "dist/metadata/unica-runtime-${target}.json" dist/runtime/
          done
          python scripts/ci/verify-release-assets.py --asset-dir dist/runtime --source local-build
      # Джоба идёт только на теге и при перезапуске дописывает ассеты к уже
      # созданному релизу; переход на `gh release` — вместе с репетицией релиза.
      - name: Publish the release assets # zizmor: ignore[superfluous-actions] замена на gh release требует репетиции на теге
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          # Предвыпуск не должен выглядеть последним релизом: его ищут те, кто
          # ищет свежее, а он существует только для замеров.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Выпуск публикует ядро и его описание — их читает
          # `verify-release-assets.py`, перекачивая с релиза. Описания поставок
          # сюда не едут: их читает только упаковщик, и берёт он их из артефакта
          # сборки. На релизе они были бы третьей копией фактов, уже записанных
          # в `tools.lock.json` исходного тега и в `runtime-manifest.json`
          # выложенного плагина, — и обещали бы ассет, которого здесь нет.
          files: |
            dist/runtime/unica-runtime-*.tar.gz
            dist/runtime/unica-runtime-*.json

  smoke-thin-plugin:
    name: Smoke published thin plugin (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [package-thin, publish-release-assets]
    if: >-
      ${{
        always() &&
        needs.package-thin.result == 'success' &&
        needs.publish-release-assets.result == 'success' &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: win-x64
            runner: windows-2022
          - target: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unica-thin-marketplace
          path: .build/thin
      - name: Smoke packaged bootstrap against published runtime
        run: >
          python scripts/ci/smoke-unica-bootstrap.py
          --plugin-root .build/thin/plugins/unica
          --target "${{ matrix.target }}"
      # Ядро выпуск публикует сам, и его байты сверяет `verify-release-assets`.
      # Поставки приезжают из тулчейна, и до этого шага их путь целиком —
      # адрес, сумма, раскладка — в выпуске не проходил никто. Одной цели
      # довольно: адреса остальных проверены отдельно и стоят одного HEAD.
      - name: Prefetch the whole delivery once, end to end
        if: ${{ matrix.target == 'linux-x64' }}
        shell: bash
        env:
          UNICA_RUNTIME_CACHE_DIR: ${{ runner.temp }}/prefetch-cache
        run: |
          set -euo pipefail
          bootstrap=".build/thin/plugins/unica/bootstrap/bin/linux-x64/unica-bootstrap"
          chmod +x "$bootstrap"
          "$bootstrap" prefetch --plugin-root .build/thin/plugins/unica

  verify-published-assets:
    name: Re-download and verify published bytes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - publish-release-assets
      - package-thin
    if: >-
      ${{
        always() &&
        needs.package-thin.result == 'success' &&
        needs.publish-release-assets.result == 'success' &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/')
      }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'unica-runtime-*' --dir published
      - run: python scripts/ci/verify-release-assets.py --asset-dir published --source re-downloaded --report published/asset-verification-re-downloaded.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unica-published-asset-verification
          path: published/asset-verification-re-downloaded.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unica-thin-marketplace
          path: .build/thin
      # Ядро сверено побайтно выше. У поставок из тулчейна байты сверены на
      # сборке, а адрес после неё не трогает никто: опечатка в теге дожила бы
      # до первого вызова движка у пользователя. Проверяются все цели —
      # прогреть на месте можно лишь одну.
      - run: >
          python scripts/ci/verify-delivery-reachable.py
          --plugin-root .build/thin/plugins/unica

  # Итог хвоста поставки тега и ручного запуска: тот же оценщик и та же
  # таблица, что у `Unica CI`, по её результатам и джобам поставки.
  delivery-ci:
    name: Delivery CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) }}
    needs:
      - unica-ci
      - rust-os
      - build-tools
      - package-thin
      - probe-thin-bootstrap
      - release-assessment
      - publish-release-assets
      - smoke-thin-plugin
      - verify-published-assets
      - p0-release-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Evaluate required CI results
        env:
          GATE_SCOPE: delivery
          NEEDS_JSON: ${{ toJSON(needs) }}
          PYTHON_MATRIX: ${{ needs.unica-ci.outputs.python_matrix }}
          RUNNERS: ${{ needs.unica-ci.outputs.runners }}
        run: python scripts/ci/evaluate-ci-gate.py
