# Temporary dispatch-only diagnostic control. No PR/merge/release route.
name: Cancel projection fixed fresh-process validation
on:
  workflow_dispatch:
    inputs:
      case_commit:
        required: true
        type: string
      payload_manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            driver: run_linux.py
          - os: windows-latest
            driver: run_windows.py
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - name: Preserve reviewed source bytes before either checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: case
          ref: ${{ inputs.case_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.148
      - name: Fixed three fresh processes per literal; stop first failure
        shell: bash
        env:
          CASE_COMMIT: ${{ inputs.case_commit }}
          PAYLOAD_SHA256: ${{ inputs.payload_manifest_sha256 }}
        run: >-
          python control/scripts/dev/cancel-projection-1753/${{ matrix.driver }}
          --case case --case-commit "$CASE_COMMIT"
          --results cancel-projection-results --payload-manifest-sha256 "$PAYLOAD_SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cancel-projection-${{ runner.os }}-first-outcome
          if-no-files-found: error
          retention-days: 7
          path: |
            cancel-projection-results/*.json
            cancel-projection-results/*.stdout
            cancel-projection-results/*.stderr
            cancel-projection-results/*.xml
            cancel-projection-results/owned-*
      - name: Retain actual control source bytes
        if: always()
        shell: bash
        run: |
          mkdir -p cancel-projection-control-source
          cp control/.github/workflows/unica-plugin-release.yml cancel-projection-control-source/workflow.yml
          cp -R control/scripts/dev/cancel-projection-1753 cancel-projection-control-source/payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cancel-projection-${{ runner.os }}-control-source
          if-no-files-found: error
          retention-days: 7
          path: cancel-projection-control-source/
