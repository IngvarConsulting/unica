  test-rust-platforms:
    name: Rust tests (complete inventory)
    needs: [classify-changes, build-rust-ordinary, build-rust-receipt, build-rust-vendor, run-rust-ordinary, run-rust-receipt, run-rust-vendor, shadow-component-selection]
    if: ${{ always() && needs.classify-changes.outputs.rust_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNNERS: ${{ needs.classify-changes.outputs.runners }}
      CI_LANE_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-rust-*
          path: .build/ci-proof/plans
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-rust-*
          path: .build/ci-proof/results
      - run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust --phase verify --runners "$RUNNERS" --sha "$GITHUB_SHA" --results .build/ci-proof
