name: Research v014 exact candidate proofs

on:
  workflow_dispatch:
    inputs:
      daemon_candidate:
        description: Exact commit for real daemon endpoint acceptance, empty skips
        type: string
        required: false
        default: ''
      unix_candidate:
        description: Exact commit for twenty consecutive full Linux queues, empty skips
        type: string
        required: false
        default: ''
      windows_candidate:
        description: Exact commit for seventeen positive Windows maintenance and recovery cases, empty skips
        type: string
        required: false
        default: ''
      windows_reference_candidate:
        description: Exact commit for Windows reference scan and finite deadline proofs, empty skips
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: research-v014-exact-${{ github.ref }}-${{ inputs.daemon_candidate }}-${{ inputs.unix_candidate }}-${{ inputs.windows_candidate }}-${{ inputs.windows_reference_candidate }}
  cancel-in-progress: false

jobs:
  daemon-endpoint:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/1496-windows-focused-probes' && inputs.daemon_candidate != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ inputs.daemon_candidate }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.daemon_candidate }}
          persist-credentials: false
      - name: Verify exact immutable source
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.143
      - name: Real daemon ownership, idle cleanup and endpoint security
        run: |
          set -euo pipefail
          mkdir -p .session-temp/v014-native
          cargo nextest run -p unica-coder --test daemon_process --profile queue --retries 0 --test-threads 2 --no-tests=fail --success-output immediate -E 'test(/^endpoint_ownership::/) | test(/^endpoint_security::/)' 2>&1 | tee .session-temp/v014-native/daemon-endpoint.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: daemon-endpoint-${{ matrix.os }}-${{ inputs.daemon_candidate }}
          path: |
            .session-temp/v014-native/*.log
            target/nextest/queue/junit.xml
          if-no-files-found: warn

  windows-maintenance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/1496-windows-focused-probes' && inputs.windows_candidate != ''
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ inputs.windows_candidate }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: never
      NEXTEST_RETRIES: '0'
      NEXTEST_TEST_THREADS: '2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.windows_candidate }}
          persist-credentials: false
      - name: Verify exact immutable candidate
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.143
      - name: Full native Windows clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Seventeen native maintenance and recovery cases, no retries or LEAK
        run: |
          set -euo pipefail
          mkdir -p .session-temp/v014-native
          filter='test(/^infrastructure::workspace_index::tests::(registered_owner_observes_maintenance_while_its_file_is_exclusively_locked|registered_owner_rejects_in_place_record_substitution_without_overwriting_it|poisoned_owner_never_proves_maintenance_or_writes_a_release_record|foreign_or_replaced_lock_never_proves_queued_or_running_maintenance|stale_recovery_does_not_overwrite_an_unexpected_held_record|stale_recovery_preserves_the_matching_record_identity_and_fields|stale_recovery_with_expected_identity_preserves_unreadable_records|stale_legacy_lock_is_recovered_by_active_lock|stale_structured_lock_is_recovered_by_active_lock|invalid_lock_without_building_status_is_treated_as_active|fresh_invalid_lock_with_stale_status_is_treated_as_active|stale_lock_held_by_current_process_is_still_active)$/) | test(/^infrastructure::workspace_services::tests::(maintenance_queue_execution_and_failure_keep_the_published_index_readable|real_index_queue_and_worker_state_reach_serialized_search_and_navigation)$/) | test(/^infrastructure::daemon::runtime_v5::tests::reopened_retirement_rejects_old_authority_and_preserves_indexes_until_confirmed_delete$/) | test(/^infrastructure::platform::filesystem::tests::(empty_owned_snapshot_preserves_bytes_and_rejects_unproven_lock_files|file_lock_contention_classifier_preserves_real_errors)$/)'
          log=.session-temp/v014-native/windows-1523-green.log
          cargo nextest run -p unica-coder --lib --profile queue --retries 0 --test-threads 2 --no-tests=fail --color never --success-output immediate -E "$filter" 2>&1 | tee "$log"
          test "$(grep -cE '^[[:space:]]*PASS \[' "$log")" -eq 17
          grep -Eq 'Summary .*17 tests run: 17 passed,' "$log"
          if grep -Eq '^[[:space:]]*(LEAK|TRY|FAIL|TIMEOUT)([[:space:]]|$)' "$log"; then
            echo 'The seventeen-case GREEN slice must have no failures, retries or leaked handles.' >&2
            exit 1
          fi
          cp target/nextest/queue/junit.xml .session-temp/v014-native/windows-1523-green-junit.xml
          {
            echo 'Seventeen Windows maintenance and recovery cases passed without failures, retries, LEAK or TIMEOUT.'
            echo 'This job does not accept the other three original Windows symptoms, #988 or the full Windows large profile.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-maintenance-${{ inputs.windows_candidate }}
          path: .session-temp/v014-native/windows-1523-*
          if-no-files-found: warn

  linux-twenty-queues:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/1496-windows-focused-probes' && inputs.unix_candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CANDIDATE_SHA: ${{ inputs.unix_candidate }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: never
      NEXTEST_RETRIES: '0'
      NEXTEST_TEST_THREADS: '2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.unix_candidate }}
          persist-credentials: false
      - name: Verify exact immutable source
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.143
      - name: Full native Linux clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Twenty consecutive complete queue profiles without retries
        run: |
          set -euo pipefail
          mkdir -p .session-temp/v014-native
          for ordinal in $(seq 1 20); do
            echo "=== Queue $ordinal of 20, exact source $CANDIDATE_SHA ==="
            python3 scripts/ci/run-tests.py --profile queue --ecosystem rust 2>&1 | tee ".session-temp/v014-native/queue-$ordinal.log"
            printf '%s %s PASS\n' "$ordinal" "$CANDIDATE_SHA" >> .session-temp/v014-native/completed-queues.txt
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-twenty-queues-${{ inputs.unix_candidate }}
          path: |
            .session-temp/v014-native/*
            target/nextest/queue/junit.xml
          if-no-files-found: warn

  windows-reference-scan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/1496-windows-focused-probes' && inputs.windows_reference_candidate != ''
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ inputs.windows_reference_candidate }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      NEXTEST_RETRIES: '0'
      NEXTEST_TEST_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.windows_reference_candidate }}
          persist-credentials: false
      - name: Verify exact immutable source
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.143
      - name: Full native Windows clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Reference scan resource and finite deadline proofs, no retries
        run: |
          set -euo pipefail
          mkdir -p .session-temp/v014-native
          filter='test(/^infrastructure::native_operations::apply::tests::(reference_scan_descriptor_count_does_not_grow_with_inputs|reference_guard_preserves_finite_deadline_after_capture_without_writing)$/)'
          log=.session-temp/v014-native/windows-reference-scan.log
          cargo nextest run -p unica-coder --lib --profile queue --ignore-default-filter --retries 0 --test-threads 1 --no-tests=fail --color never --success-output immediate -E "$filter" 2>&1 | tee "$log"
          test "$(grep -cE '^[[:space:]]*PASS \[' "$log")" -eq 2
          grep -Eq 'Summary .*2 tests run: 2 passed,' "$log"
          if grep -Eq '^[[:space:]]*(LEAK|TRY|FAIL|TIMEOUT)([[:space:]]|$)' "$log"; then
            echo 'Reference proofs must have no failures, retries or leaked handles.' >&2
            exit 1
          fi
          cp target/nextest/queue/junit.xml .session-temp/v014-native/windows-reference-scan-junit.xml
          echo 'Only the two reference scan proofs ran; lazy cancellation, 4097 Task and full Windows large remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-reference-scan-${{ inputs.windows_reference_candidate }}
          path: .session-temp/v014-native/windows-reference-scan*
          if-no-files-found: warn
