name: Research v014 exact candidate proofs

on:
  workflow_dispatch:
    inputs:
      daemon_candidate:
        description: Exact commit for real daemon endpoint acceptance, empty skips
        type: string
        required: false
        default: ''
      unix_candidate:
        description: Exact commit for twenty consecutive full Linux queues, empty skips
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: research-v014-exact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daemon-endpoint:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/1496-windows-focused-probes' && inputs.daemon_candidate != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ inputs.daemon_candidate }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.daemon_candidate }}
          persist-credentials: false
      - name: Verify exact immutable source
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.143
      - name: Real daemon ownership, idle cleanup and endpoint security
        run: |
          set -euo pipefail
          mkdir -p .session-temp/v014-native
          cargo nextest run -p unica-coder --test daemon_process --profile queue --retries 0 --test-threads 2 --no-tests=fail --success-output immediate -E 'test(/^endpoint_ownership::/) | test(/^endpoint_security::/)' 2>&1 | tee .session-temp/v014-native/daemon-endpoint.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: daemon-endpoint-${{ matrix.os }}-${{ inputs.daemon_candidate }}
          path: |
            .session-temp/v014-native/*.log
            target/nextest/queue/junit.xml
          if-no-files-found: warn

  linux-twenty-queues:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/1496-windows-focused-probes' && inputs.unix_candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CANDIDATE_SHA: ${{ inputs.unix_candidate }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: never
      NEXTEST_RETRIES: '0'
      NEXTEST_TEST_THREADS: '2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.unix_candidate }}
          persist-credentials: false
      - name: Verify exact immutable source
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.143
      - name: Full native Linux clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Twenty consecutive complete queue profiles without retries
        run: |
          set -euo pipefail
          mkdir -p .session-temp/v014-native
          for ordinal in $(seq 1 20); do
            echo "=== Queue $ordinal of 20, exact source $CANDIDATE_SHA ==="
            python3 scripts/ci/run-tests.py --profile queue --ecosystem rust 2>&1 | tee ".session-temp/v014-native/queue-$ordinal.log"
            printf '%s %s PASS\n' "$ordinal" "$CANDIDATE_SHA" >> .session-temp/v014-native/completed-queues.txt
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-twenty-queues-${{ inputs.unix_candidate }}
          path: |
            .session-temp/v014-native/*
            target/nextest/queue/junit.xml
          if-no-files-found: warn
