name: Unica CI

# Ворота pull request и очереди слияния: одна джоба Linux без маршрутов.
# Pull request: формат, контракт версий, Clippy и быстрые проверки Python, цель до трёх
# минут. Очередь: тесты Rust и Python профиля `queue`. Ранний сигнал по тестам — локальный
# прогон перед снятием черновика. Windows и macOS целиком, тяжёлые тесты и упаковка
# идут ночью и в выпуске, в `release.yml`.
on:
  pull_request:
    # Черновик не занимает раннер. Перевод в готовые запускает прогон:
    # без `ready_for_review` на его head осталась бы пропущенная проверка.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Новый push отменяет прогон того же pull request. Прогон записи очереди
# не отменяется: очередь сама снимает записи.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Переменные `CARGO*` входят в ключ rust-cache. Те же значения у ночного контура,
# который этот кэш пишет: иначе он сюда не подойдёт.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  PYTHONUTF8: "1"
  GATE_PROFILE: ${{ github.event_name == 'merge_group' && 'queue' || 'pr' }}

jobs:
  unica-ci:
    # Имя обязательной проверки ruleset. Условие пропускает только черновик,
    # а черновик влить нельзя.
    name: Unica CI
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Python-проверки читают историю репозитория.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/ci/requirements.txt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        if: github.event_name == 'merge_group'
        with:
          tool: cargo-nextest@0.9.148
      # Только чтение: pull request и очередь берут кэш области `main`.
      - name: Кэш зависимостей Rust # zizmor: ignore[cache-poisoning] restore-only; pull request и очередь читают область main и ничего не пишут
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-rust-ordinary
          save-if: false
      - name: Формат
        run: cargo fmt --all -- --check
      - name: Контракт версий
        run: python scripts/ci/check-version-contract.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Medium Python запускает продукт. Сборка идёт до тестов Rust: вызов
      # контракта ReceiptLedger пересобирает `unica` со своим признаком.
      - name: Продукт для Python
        if: github.event_name == 'merge_group'
        run: |
          python scripts/ci/prepared_binary.py build --destination .build/ci-product --target-dir target
          echo "UNICA_PREPARED_BINARY_MANIFEST=$PWD/.build/ci-product/manifest.json" >> "$GITHUB_ENV"
      # Красный шаг не отменяет следующие: упавший тест не прячет остальные.
      - name: Тесты Rust
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem rust
      - name: Тесты Python
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        run: python scripts/ci/run-tests.py --profile "$GATE_PROFILE" --ecosystem python
      - name: Статические проверки Python
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python scripts/ci/run-static-tests.py

  windows-clippy:
    # Пропуск на pull request не мешает сделать проверку обязательной:
    # пропущенная по условию джоба считается пройденной, а очередь её исполняет.
    name: Clippy (windows-latest)
    if: github.event_name == 'merge_group'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - name: Кэш зависимостей Rust # zizmor: ignore[cache-poisoning] restore-only; очередь читает область main и ничего не пишет
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-rust-ordinary
          save-if: false
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
