name: Probe 1786 retirement fixture timing

# Throwaway probe for #1786 on a scratch branch; never merged.
on:
  push:
    branches: [probe/1786-windows-retirement]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-rust-ordinary
          save-if: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Environment
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List
          Get-CimInstance Win32_Processor | Select-Object NumberOfLogicalProcessors | Format-List
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          echo "TEMP=$env:TEMP"
      - name: Large, as the nightly runs it
        shell: bash
        run: |
          cargo nextest run --workspace --profile large --no-tests=pass --no-fail-fast --success-output final --failure-output final > large.log 2>&1 || true
          grep -E "PROBE prep|receipt_runtime_tests::|Summary \[" large.log | grep -vE "^\s+(START|SLOW)" | tail -400
      - name: Receipt runtime tests alone under nextest
        shell: bash
        run: |
          for round in 1 2; do
            cargo nextest run -p unica-coder --lib --profile large --no-fail-fast --success-output final -E 'test(/receipt_runtime_tests::/)' > alone.log 2>&1 || true
            grep -E "PROBE prep|  (PASS|FAIL|TRY|FLAKY) .*retirement|Summary \[" alone.log | tail -80
          done
