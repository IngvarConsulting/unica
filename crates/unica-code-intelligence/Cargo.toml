[package]
name = "unica-code-intelligence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
test-support = ["unica-configuration/test-support"]

[dependencies]
unica-workspace = { path = "../unica-workspace" }
unica-navigation = { path = "../unica-navigation" }
unica-address = { path = "../unica-address" }
unica-bsl = { path = "../unica-bsl" }
unica-bsl-parser = { path = "../unica-bsl-parser" }
unica-code-model = { path = "../unica-code-model" }
unica-source-contract = { path = "../unica-source-contract" }
unica-work-control = { path = "../unica-work-control" }
unica-configuration = { path = "../unica-configuration" }
serde.workspace = true
serde_json.workspace = true


[dev-dependencies]
unica-configuration = { path = "../unica-configuration", features = ["test-support"] }
uuid.workspace = true
unica-address = { path = "../unica-address" }

[package.metadata.unica]
component = "coordinator"
file-io = "none"
