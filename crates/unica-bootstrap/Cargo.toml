[package]
name = "unica-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "unica-bootstrap"
path = "src/main.rs"

[lib]
name = "unica_bootstrap"
path = "src/lib.rs"

[dependencies]
unica-error-reporting = { path = "../unica-error-reporting" }
unica-artifact-delivery = { path = "../unica-artifact-delivery" }
unica-source-contract = { path = "../unica-source-contract" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
sha2.workspace = true
uuid.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Pipes", "Win32_System_SystemInformation"] }

[dev-dependencies]
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
uuid.workspace = true

[package.metadata.unica]
component = "service"
file-io = "owned"
inputs = ["plugins/unica"]
