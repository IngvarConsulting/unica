[package]
name = "unica-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "unica-bootstrap"
path = "src/main.rs"

[lib]
name = "unica_bootstrap"
path = "src/lib.rs"

[features]
# Стенды TLS-сервера и CONNECT-прокси для тестов сетевых потребителей.
# Включается только в dev-dependencies: продуктовая сборка их не содержит.
network-test-support = ["dep:rcgen"]

[dependencies]
flate2.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
ureq.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
webpki-roots.workspace = true
rcgen = { workspace = true, optional = true }
url.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
rcgen.workspace = true
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
uuid.workspace = true
zip.workspace = true
