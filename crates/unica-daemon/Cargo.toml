unica-workspace = { path = "../unica-workspace" }
unica-redaction = { path = "../unica-redaction" }
unica-bsl = { path = "../unica-bsl" }
unica-xdto = { path = "../unica-xdto" }
unica-templates = { path = "../unica-templates" }
unica-operations = { path = "../unica-operations" }
unica-diagnostics = { path = "../unica-diagnostics" }
unica-navigation = { path = "../unica-navigation" }
unica-code-intelligence = { path = "../unica-code-intelligence" }
unica-execution = { path = "../unica-execution" }
unica-forms = { path = "../unica-forms" }
