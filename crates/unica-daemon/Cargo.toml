[package.metadata.unica]
version-literal-baseline = 28
component = "product"
file-io = "owned"
inputs = ["crates/unica-coder/src/infrastructure/format_gate.rs", "crates/unica-coder/tests/fixtures/additional_indexes", "crates/unica-execution/src/receipt_runtime.rs", "plugins/unica/skills", "plugins/unica/third-party/tools.lock.json", "tests/fixtures/acceptance", "tests/fixtures/analyzer", "tests/fixtures/platform_8_3_27", "tests/fixtures/unica_mcp_script_parity"]
read-outside-baseline = 0
