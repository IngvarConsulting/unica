[package]
name = "unica-coder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "unica"
path = "src/main.rs"

[lib]
name = "unica_coder"
path = "src/lib.rs"

[features]
default = []
receipt-ledger-test-support = []
# Исследования — не тесты: их цели собираются только с этой фичей, и в плане
# конвейера их нет. Запуск — scripts/research/.
research = []

[[test]]
name = "daemon_receipt_ledger"
path = "tests/daemon_receipt_ledger.rs"
required-features = ["receipt-ledger-test-support"]

[[test]]
name = "research_xml_corpus"
path = "tests/research/xml_corpus.rs"
required-features = ["research"]

[[test]]
name = "research_cf_init_checkpoint"
path = "tests/research/cf_init_checkpoint.rs"
required-features = ["research"]

[dependencies]
bsl-parser.workspace = true
# Доставку движка по требованию ведёт тот же установщик, что ставит ядро:
# формат манифеста, ключ кеша, блокировка и докачка у них общие, и вторая
# реализация была бы местом, где они разойдутся.
unica-bootstrap = { path = "../unica-bootstrap" }
bsl-syntax.workspace = true
diffy.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
unsafe-libyaml.workspace = true
sha2.workspace = true
rmcp.workspace = true
chrono.workspace = true
tokio.workspace = true
toml.workspace = true
roxmltree.workspace = true
rust-stemmers.workspace = true
regex.workspace = true
tempfile.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true
# `flate2` кодом крейта не вызывается: она объявлена, чтобы `zip` получил
# чистый Rust-backend для deflate вместо системного zlib и без `zopfli`
# (см. комментарий у `zip` в корневом Cargo.toml).
flate2.workspace = true
zip.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-services.workspace = true
objc2-core-foundation.workspace = true
dispatch2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
cap-primitives.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
cap-primitives.workspace = true
cap-fs-ext.workspace = true

[dev-dependencies]
jsonschema.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
