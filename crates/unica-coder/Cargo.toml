[package]
name = "unica-coder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "unica_coder"
path = "src/lib.rs"

[features]
default = []
test-support = [
    "unica-application/test-support",
    "unica-daemon-protocol/test-support",
    "unica-roles-designer/test-support",
    "unica-templates-designer/test-support",
    "unica-xdto-designer/test-support",
    "unica-bsl/test-support",
    "unica-forms-designer/test-support",
    "unica-metadata-designer/test-support",
    "unica-adapter-lexical/test-support",
    "unica-adapter-bsl-analyzer/test-support",
    "unica-analysis-services/test-support",
    "unica-artifact-delivery/test-support",
    "unica-adapter-v8-runner/test-support",
    "unica-workspace/test-support",
    "unica-redaction/test-support",
    "unica-forms/test-support",
    "unica-xdto/test-support",
    "unica-dcs/test-support",
    "unica-templates/test-support",
    "unica-diagnostics/test-support",
    "unica-navigation/test-support",
    "unica-code-intelligence/test-support",
    "unica-execution/test-support",
    "unica-metadata/test-support",
    "unica-source-contract/test-support",
    "unica-execution-contract/test-support",
    "unica-process/test-support",
    "unica-work-control/test-support",
    "unica-network/test-support",
]

[dependencies]
unica-application = { path = "../unica-application" }
unica-domain = { path = "../unica-domain" }
unica-daemon-protocol = { path = "../unica-daemon-protocol" }
unica-editor-analysis = { path = "../unica-editor-analysis" }
unica-bindings = { path = "../unica-bindings" }
unica-adapter-lexical = { path = "../unica-adapter-lexical" }
unica-adapter-bsl-analyzer = { path = "../unica-adapter-bsl-analyzer" }
unica-analysis-services = { path = "../unica-analysis-services" }
unica-dcs-designer = { path = "../unica-dcs-designer" }
unica-roles-designer = { path = "../unica-roles-designer" }
unica-templates-designer = { path = "../unica-templates-designer" }
unica-forms-designer = { path = "../unica-forms-designer" }
unica-metadata-designer = { path = "../unica-metadata-designer" }
unica-xdto-designer = { path = "../unica-xdto-designer" }
unica-adapter-v8-runner = { path = "../unica-adapter-v8-runner" }
unica-workspace = { path = "../unica-workspace" }
unica-redaction = { path = "../unica-redaction" }
unica-bsl = { path = "../unica-bsl" }
unica-xdto = { path = "../unica-xdto" }
unica-dcs = { path = "../unica-dcs" }
unica-templates = { path = "../unica-templates" }
unica-operations = { path = "../unica-operations" }
unica-diagnostics = { path = "../unica-diagnostics" }
unica-navigation = { path = "../unica-navigation" }
unica-code-intelligence = { path = "../unica-code-intelligence" }
unica-execution = { path = "../unica-execution" }
unica-forms = { path = "../unica-forms" }
unica-documentation-sources = { path = "../unica-documentation-sources" }
unica-configuration = { path = "../unica-configuration" }
unica-metadata = { path = "../unica-metadata" }
unica-source-contract = { path = "../unica-source-contract" }
unica-source-designer = { path = "../unica-source-designer" }
unica-bsl-parser = { path = "../unica-bsl-parser" }
unica-roles = { path = "../unica-roles" }
unica-refusal = { path = "../unica-refusal" }
unica-execution-contract = { path = "../unica-execution-contract" }
unica-documentation = { path = "../unica-documentation" }
unica-address = { path = "../unica-address" }
unica-process = { path = "../unica-process" }
unica-artifact-delivery = { path = "../unica-artifact-delivery" }
unica-xml-format = { path = "../unica-xml-format" }
unica-operation-contract = { path = "../unica-operation-contract" }
unica-network = { path = "../unica-network" }
unica-work-control = { path = "../unica-work-control" }
base64.workspace = true
# Доставку движка по требованию ведёт тот же установщик, что ставит ядро:
# формат манифеста, ключ кеша, блокировка и докачка у них общие, и вторая
# реализация была бы местом, где они разойдутся.
unica-bootstrap = { path = "../unica-bootstrap" }
diffy.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
unsafe-libyaml.workspace = true
sha2.workspace = true
aes-siv.workspace = true
getrandom.workspace = true
zeroize.workspace = true
toml.workspace = true
roxmltree.workspace = true
xml.workspace = true
rust-stemmers.workspace = true
tempfile.workspace = true
url.workspace = true
uuid.workspace = true
# `flate2` кодом крейта не вызывается: она объявлена, чтобы `zip` получил
# чистый Rust-backend для deflate вместо системного zlib и без `zopfli`
# (см. комментарий у `zip` в корневом Cargo.toml).
flate2.workspace = true
zip.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
cap-primitives.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
cap-primitives.workspace = true
cap-fs-ext.workspace = true

[dev-dependencies]
unica-application = { path = "../unica-application", features = ["test-support"] }
unica-daemon-protocol = { path = "../unica-daemon-protocol", features = ["test-support"] }
unica-roles-designer = { path = "../unica-roles-designer", features = ["test-support"] }
unica-templates-designer = { path = "../unica-templates-designer", features = ["test-support"] }
unica-xdto-designer = { path = "../unica-xdto-designer", features = ["test-support"] }
unica-bsl = { path = "../unica-bsl", features = ["test-support"] }
unica-forms-designer = { path = "../unica-forms-designer", features = ["test-support"] }
unica-metadata-designer = { path = "../unica-metadata-designer", features = ["test-support"] }
unica-adapter-lexical = { path = "../unica-adapter-lexical", features = ["test-support"] }
unica-adapter-bsl-analyzer = { path = "../unica-adapter-bsl-analyzer", features = ["test-support"] }
unica-analysis-services = { path = "../unica-analysis-services", features = ["test-support"] }
unica-artifact-delivery = { path = "../unica-artifact-delivery", features = ["test-support"] }
unica-adapter-v8-runner = { path = "../unica-adapter-v8-runner", features = ["test-support"] }
unica-workspace = { path = "../unica-workspace", features = ["test-support"] }
unica-redaction = { path = "../unica-redaction", features = ["test-support"] }
unica-forms = { path = "../unica-forms", features = ["test-support"] }
unica-xdto = { path = "../unica-xdto", features = ["test-support"] }
unica-dcs = { path = "../unica-dcs", features = ["test-support"] }
unica-templates = { path = "../unica-templates", features = ["test-support"] }
unica-diagnostics = { path = "../unica-diagnostics", features = ["test-support"] }
unica-navigation = { path = "../unica-navigation", features = ["test-support"] }
unica-code-intelligence = { path = "../unica-code-intelligence", features = ["test-support"] }
unica-execution = { path = "../unica-execution", features = ["test-support"] }
unica-metadata = { path = "../unica-metadata", features = ["test-support"] }
unica-source-contract = { path = "../unica-source-contract", features = ["test-support"] }
unica-execution-contract = { path = "../unica-execution-contract", features = ["test-support"] }
unica-process = { path = "../unica-process", features = ["test-support"] }
unica-work-control = { path = "../unica-work-control", features = ["test-support"] }
unica-network = { path = "../unica-network", features = ["test-support"] }
jsonschema.workspace = true
regex.workspace = true
quote.workspace = true
syn.workspace = true
tar.workspace = true

[package.metadata.unica]
version-literal-baseline = 44
component = "product"
file-io = "owned"
# `crates`: tests compare the operation tables and codecs of other crates with their sources.
# `plugins/unica`: the skills, the tools lock and the plugin root a test runs the bundled runner from.
inputs = ["crates", "plugins/unica","tests/fixtures/acceptance", "tests/fixtures/analyzer", "tests/fixtures/bsl_analyzer", "tests/fixtures/formats/platform_xml/2.20", "tests/fixtures/formats/platform_xml/2.21", "tests/fixtures/formats/platform_xml/2.22", "tests/fixtures/styleitem_values", "tests/fixtures/unica_mcp_script_parity", "tests/fixtures/v013", "tests/fixtures/xdto"]
read-outside-baseline = 1
