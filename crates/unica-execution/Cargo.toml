[package]
name = "unica-execution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
test-support = ["unica-workspace/test-support", "unica-process/test-support"]
receipt-ledger-test-support = ["unica-execution-contract/receipt-ledger-test-support"]

[dependencies]
unica-runner = { path = "../unica-runner" }
unica-process = { path = "../unica-process" }
unica-redaction = { path = "../unica-redaction" }
unica-source-contract = { path = "../unica-source-contract" }
fs2.workspace = true
unica-workspace = { path = "../unica-workspace" }
uuid.workspace = true
unica-work-control = { path = "../unica-work-control" }
unica-refusal = { path = "../unica-refusal" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
unica-execution-contract = { path = "../unica-execution-contract" }

[dev-dependencies]
unica-process = { path = "../unica-process", features = ["test-support"] }
libc.workspace = true
unica-workspace = { path = "../unica-workspace", features = ["test-support"] }
unica-execution-contract = { path = "../unica-execution-contract", features = ["test-support"] }
tempfile.workspace = true
