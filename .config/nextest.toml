# Исполнитель тестов Rust. Настройка одна на конвейер и локальный прогон,
# поэтому расхождений «у меня зелено, а там красно» из-за настроек быть не
# может. Профиль — это ворота: `pr`, `queue`, `main`, `release`; все они
# наследуют `default`, а `default` остаётся локальным «гони всё».

[profile.default]
# Потоков — по числу ядер (умолчание nextest). Единица была переносом: тесты
# делили состояние процесса и шли `--test-threads=1`; nextest даёт процесс на
# тест, и связь через состояние разорвана. Тесты, делящие ресурс машины —
# порт, каталог, — при этом падают сами, и это находка, а не помеха.
# Один повтор с паузой. Нестабильность лечится повтором, а не терпением, но
# повтор прячет настоящую поломку так же, как лечит нестабильность — поэтому
# каждая неудачная попытка уходит в отчёт записью, и график повторов Allure
# её показывает. Число выбрано стартовым: первые пять прогонов с историей
# прошли без единого падения; поднимать его — только по графику.
retries = { backoff = "fixed", count = 1, delay = "2s" }
# Прогон идёт до конца: упавший тест не прячет остальных. `cargo test`
# останавливался на первой упавшей цели, и картина падений была неполной.
fail-fast = false
# Срок на тест — то, чем размер держится честным. Пока размеры не расставлены,
# всем достаётся срок `small`: 60 с до пометки SLOW, остановка после второго
# периода. Замер 05.09.2026 на main: самый долгий тест 16,4 с, p99 — 1,8 с.
# Сроки `medium` (300 с) и `large` (900 с) придут переопределениями по
# выражению размера вместе с расстановкой размеров.
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.default.junit]
path = "junit.xml"
report-name = "unica"
# Проигнорированные тесты попадают в отчёт как `skipped`: молча вынести тест
# из гейта нельзя, его отсутствие обязано быть видимым.
report-skipped = "ignored"
store-success-output = false
# Вывод упавшего теста — самое полезное в отчёте. Раннеры публичные, секретов
# в проекте нет.
store-failure-output = true

# Ворота → профиль. Отбора пока нет: каждый профиль гоняет всё (`all()`) —
# площадка под ярусы готова, ярусы расставляются последним шагом плана и
# меняют эти выражения осознанно, вместе со стражем состава.
# Pull request — только `small`: всё, что не объявлено `medium`. Сроки и
# состав `medium` — ниже, одним выражением на два места; страж размера
# держит их равными и проверяет, что каждый файл с процессом или сокетом в
# выражении назван.
[profile.pr]
# >>> размер medium (ворота pr): пишет scripts/ci/size-filters.py --write
default-filter = '''not (
kind(test)
    | test(/^download::(tests)::/)
    | test(/^host::plugin_manifest::(tests)::/)
    | test(/^host::skill_package::(tests)::/)
    | test(/^platform::process::(tests)::/)
    | test(/^application::(tests)::/)
    | test(/^application::meta_add_surface_tests::[^:]+$/)
    | test(/^application::meta_info_surface_tests::[^:]+$/)
    | test(/^application::metadata::(tests)::/)
    | test(/^application::result_store::(tests)::/)
    | test(/^composition::(tests)::/)
    | test(/^infrastructure::application_ports::(engine_map_tests|tests)::/)
    | test(/^infrastructure::bsl_outline::(tests)::/)
    | test(/^infrastructure::code_intelligence::(tests)::/)
    | test(/^infrastructure::daemon::(tests)::/)
    | test(/^infrastructure::daemon::client_v5::(tests)::/)
    | test(/^infrastructure::daemon::protocol_v5::(tests)::/)
    | test(/^infrastructure::daemon::runtime_v5::(tests)::/)
    | test(/^infrastructure::daemon::server::(actor_capacity_tests)::/)
    | test(/^infrastructure::format_guard::(staged_root_tests|tests)::/)
    | test(/^infrastructure::metadata_operations::(tests)::/)
    | test(/^infrastructure::native_operations::apply::(tests)::/)
    | test(/^infrastructure::native_operations::cf::(cf_edit_transaction_tests|cf_init_transaction_tests|cf_read_selector_bridge_tests|metadata_kind_consumer_tests)::/)
    | test(/^infrastructure::native_operations::code::(tests)::/)
    | test(/^infrastructure::native_operations::common::(mutation_tests)::/)
    | test(/^infrastructure::native_operations::compile_transaction::(tests)::/)
    | test(/^infrastructure::native_operations::event::(tests)::/)
    | test(/^infrastructure::native_operations::form::(form_read_selector_bridge_tests|tests)::/)
    | test(/^infrastructure::native_operations::logical_selector::(tests)::/)
    | test(/^infrastructure::native_operations::meta::publisher::(typed_add_publication_tests)::/)
    | test(/^infrastructure::native_operations::meta::validation_context::(tests)::/)
    | test(/^infrastructure::native_operations::mxl::(mxl_read_selector_bridge_tests|tests)::/)
    | test(/^infrastructure::native_operations::registry::(tests)::/)
    | test(/^infrastructure::native_operations::role::(role_compile_contract_tests|role_edit_contract_tests|role_info_typed_result_tests)::/)
    | test(/^infrastructure::native_operations::single_file_publisher::(tests)::/)
    | test(/^infrastructure::native_operations::subsystem::(subsystem_info_typed_result_tests|subsystem_read_selector_bridge_tests|tests)::/)
    | test(/^infrastructure::native_operations::support::(tests)::/)
    | test(/^infrastructure::native_operations::v13_analysis::(tests)::/)
    | test(/^infrastructure::native_operations::xdto::(tests)::/)
    | test(/^infrastructure::path_policy::(tests)::/)
    | test(/^infrastructure::platform::filesystem::(tests)::/)
    | test(/^infrastructure::platform::process::(tests)::/)
    | test(/^infrastructure::platform::testing::(tests)::/)
    | test(/^infrastructure::platform_xml_owner::(tests)::/)
    | test(/^infrastructure::platform_xml_source_targets::(tests)::/)
    | test(/^infrastructure::project_health::git::(tests)::/)
    | test(/^infrastructure::project_health::resources::(tests)::/)
    | test(/^infrastructure::project_sources::(tests)::/)
    | test(/^infrastructure::rlm_navigation::(tests)::/)
    | test(/^infrastructure::runtime_jobs::(tests)::/)
    | test(/^infrastructure::source_roots::(tests)::/)
    | test(/^infrastructure::support_state::(tests)::/)
    | test(/^infrastructure::tool_context::(tests)::/)
    | test(/^infrastructure::workspace::(tests)::/)
    | test(/^infrastructure::workspace_actor::(tests)::/)
    | test(/^infrastructure::workspace_index::(tests)::/)
    | test(/^infrastructure::workspace_services::(tests)::/)
    | test(/^interfaces::mcp::(tests)::/)
)'''
# <<< размер medium (ворота pr)

[profile.queue]
default-filter = 'all()'

[profile.main]
default-filter = 'all()'

[profile.release]
default-filter = 'all()'

# Ночной ярус. Пуст до расстановки размеров: выражение придёт вместе с ней,
# а до тех пор ночь честно гоняет ноль и пишет память о проверенной вершине.
[profile.large]
default-filter = 'none()'

# Срок `medium` — 300 с, остановка после второго периода; `small` остаётся на
# сроке `default`. Выражение — то же, что у ворот `pr`.
# >>> размер medium (срок): пишет scripts/ci/size-filters.py --write
