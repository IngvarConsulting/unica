# Исполнитель тестов Rust. Профиль один: и конвейер, и локальный прогон идут
# через него, поэтому расхождений «у меня зелено, а там красно» из-за настроек
# быть не может.

[profile.default]
# Один поток — не выбор, а перенос: тесты делили состояние процесса, и набор
# шёл `--test-threads=1`. nextest даёт процесс на тест, так что связь через
# состояние уже разорвана; параллельность включается отдельным шагом с замером,
# чтобы гонку за ресурс машины не спутать со скрытой связью тестов.
test-threads = 1
retries = 0
# Прогон идёт до конца: упавший тест не прячет остальных. `cargo test`
# останавливался на первой упавшей цели, и картина падений была неполной.
fail-fast = false

[profile.default.junit]
path = "junit.xml"
report-name = "unica"
# Проигнорированные тесты попадают в отчёт как `skipped`: молча вынести тест
# из гейта нельзя, его отсутствие обязано быть видимым.
report-skipped = "ignored"
store-success-output = false
# Вывод упавшего теста — самое полезное в отчёте. Раннеры публичные, секретов
# в проекте нет.
store-failure-output = true
