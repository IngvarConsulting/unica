# Исполнитель тестов Rust. Настройка одна на конвейер и локальный прогон,
# поэтому расхождений «у меня зелено, а там красно» из-за настроек быть не
# может. Профиль — это ворота: `pr`, `queue`, `main`, `release`; все они
# наследуют `default`, а `default` остаётся локальным «гони всё».

# Версия закреплена тут же, а не только в workflow: локальный nextest старше
# получит предупреждение, а страж сверяет число с шагом установки в CI.
nextest-version = { recommended = "0.9.148" }

[profile.default]
# Потоков — по числу ядер (умолчание nextest). Единица была переносом: тесты
# делили состояние процесса и шли `--test-threads=1`; nextest даёт процесс на
# тест, и связь через состояние разорвана. Тесты, делящие ресурс машины —
# порт, каталог, — при этом падают сами, и это находка, а не помеха.
# Один повтор с паузой. Нестабильность лечится повтором, а не терпением, но
# повтор прячет настоящую поломку так же, как лечит нестабильность — поэтому
# каждая неудачная попытка уходит в отчёт записью, и график повторов Allure
# её показывает. Число выбрано стартовым: первые пять прогонов с историей
# прошли без единого падения; поднимать его — только по графику.
retries = { backoff = "fixed", count = 1, delay = "2s" }
# Прогон идёт до конца: упавший тест не прячет остальных. `cargo test`
# останавливался на первой упавшей цели, и картина падений была неполной.
fail-fast = false
# Срок на тест — то, чем размер держится честным. Пока размеры не расставлены,
# всем достаётся срок `small`: 60 с до пометки SLOW, остановка после второго
# периода. Замер 05.09.2026 на main: самый долгий тест 16,4 с, p99 — 1,8 с.
# Сроки `medium` (300 с) и `large` (900 с) задают переопределения ниже по
# выражениям размера.
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.default.junit]
path = "junit.xml"
report-name = "unica"
# Проигнорированные тесты попадают в отчёт как `skipped`: молча вынести тест
# из гейта нельзя, его отсутствие обязано быть видимым.
report-skipped = "ignored"
store-success-output = false
# Вывод упавшего теста — самое полезное в отчёте. Раннеры публичные, секретов
# в проекте нет.
store-failure-output = true

# Ворота → профиль. Отбора пока нет: каждый профиль гоняет всё (`all()`) —
# площадка под ярусы готова, ярусы расставляются последним шагом плана и
# меняют эти выражения осознанно, вместе со стражем состава.
# Pull request — только `small`: всё, что не объявлено `medium`. Тест
# объявляет себя `medium` сам: интеграционная цель Cargo (`kind(test)`) или
# сегмент пути `medium` — модуль `medium_tests` (`medium_<имя>_tests`) либо
# функция `medium_<имя>`. Процесс, сокет или замер дольше 3 с — `medium`.
# Выражение постоянное, одно на два места: ворота `pr` и срок `medium` ниже.
[profile.pr]
default-filter = '''not (
kind(test)
    | test(/(^|::)medium(_|::|$)/)
) & not (
(
binary(daemon_receipt_ledger) & (
    test(/^acknowledged_catalog_crosses_former_byte_pool_and_reopens_exactly$/)
    | test(/^acknowledgement_crosses_former_tombstone_count_and_reopens_without_replay$/)
    | test(/^deterministic_horizon_load_does_not_saturate$/)
    | test(/^retained_receipt_and_task_catalogs_are_independent_after_restart$/)
    | test(/^retained_receipt_backed_terminals_do_not_starve_target_direct_load$/)
    | test(/^staged_handoff_materializes_past_former_link_quota_and_reopens_exact_winner$/)
    | test(/^task_handoff_before_begun_materializes_past_former_link_quota_without_callback$/)
    | test(/^task_store_4097_materialization_preserves_existing_tasks_listener_and_recovery$/)
    | test(/^task_store_capacity_after_reservation_is_invariant_violation_and_fail_stops$/)
    | test(/^thirty_two_lazy_cancel_actor_batch_finishes_within_125ms$/)
)
) | (
binary(unica_coder) & (
    test(/^infrastructure::daemon::medium_receipt_runtime_tests::promoted_reads_run_past_former_deadlines_and_complete_through_their_tasks$/)
    | test(/^infrastructure::daemon::v13_workspace_bootstrap::medium_tests::root_check_streams_an_index_past_the_former_capture_limit$/)
)
) | (
binary(unica_project_health) & (
    test(/^inspection::git::medium_tests::project_health_git_ignore_batch_reads_staged_blobs_past_the_former_limits_with_two_children$/)
    | test(/^inspection::resources::medium_tests::continued_repository_eol_resumes_on_disk_past_the_former_evidence_capacity$/)
    | test(/^inspection::resources::medium_tests::staged_attribute_policy_past_the_former_file_and_byte_limits_is_checked$/)
)
) | (
binary(unica_workspace) & (
    test(/^selection_evidence::tests::aggregate_selection_records_cross_former_65536_with_real_absences$/)
    | test(/^selection_evidence::tests::aggregate_selection_route_names_cross_former_8mib_with_real_absences$/)
)
) | (
binary(selection) & (
    test(/^aggregate_selection_directory_handles_cross_former_128_and_keep_finality$/)
    | test(/^aggregate_selection_exact_bytes_cross_former_32mib_without_source_walk$/)
    | test(/^aggregate_selection_membership_crosses_former_16384_across_sources$/)
)
)
)'''

# Очередь и `main` — `small` и `medium`: всё, кроме `large` и временного
# каталога `nightly-only`. Выражение `large` ниже — одно на четыре места
# (очередь, `main`, ночь и срок); страж состава держит их равными.
