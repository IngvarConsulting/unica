binary(unica_project_health) & (
    test(/^inspection::git::medium_tests::project_health_git_ignore_batch_reads_staged_blobs_past_the_former_limits_with_two_children$/)
    | test(/^inspection::resources::medium_tests::continued_repository_eol_resumes_on_disk_past_the_former_evidence_capacity$/)
    | test(/^inspection::resources::medium_tests::staged_attribute_policy_past_the_former_file_and_byte_limits_is_checked$/)
)
) | (
binary(unica_workspace) & (
    test(/^selection_evidence::tests::aggregate_selection_records_cross_former_65536_with_real_absences$/)
    | test(/^selection_evidence::tests::aggregate_selection_route_names_cross_former_8mib_with_real_absences$/)
)
) | (
binary(selection) & (
    test(/^aggregate_selection_directory_handles_cross_former_128_and_keep_finality$/)
    | test(/^aggregate_selection_exact_bytes_cross_former_32mib_without_source_walk$/)
    | test(/^aggregate_selection_membership_crosses_former_16384_across_sources$/)
)
)
'''
# <<< размер large (ворота large)

# Ночью Windows гоняет весь набор: с матрицы pull request и main он снят за
# цену раннера, а в ночном ярусе его отказ делает прогон красным (#2152).
# Модель горизонта нагрузки квитанций на Windows идёт около 800 с: допуск
# исходников на каждом вызове и контрольные чтения каталога квитанций стоят
# там в 5–29 раз дороже, чем на Linux (замер 24.10.2026: windows-latest 799 с,
# ubuntu 220 с; #2038). Срок `large` её вмещает; прежде её останавливал на
# 600 с срок `medium`, стоявший раньше (#1879).

# Срок `large` — 900 с, остановка после второго периода, и вся машина одному
# тесту: нагрузочные ворота меряют p99 задержки записи, и соседний тест на
# том же ядре красит их без вины кода.
# Блок стоит раньше срока `medium`: nextest берёт для каждой настройки первое
# совпавшее переопределение, а почти все тесты `large` совпадают и с выражением
# срока `medium` (`kind(test)` и термы модулей). В обратном порядке 14 из 16
# тестов `large` останавливались на 600 с вместо 1800 с на всех ОС (#1879).
# >>> размер large (срок)
[[profile.default.overrides]]
filter = '''
(
binary(daemon_receipt_ledger) & (
    test(/^acknowledged_catalog_crosses_former_byte_pool_and_reopens_exactly$/)
    | test(/^acknowledgement_crosses_former_tombstone_count_and_reopens_without_replay$/)
    | test(/^deterministic_horizon_load_does_not_saturate$/)
    | test(/^retained_receipt_and_task_catalogs_are_independent_after_restart$/)
    | test(/^retained_receipt_backed_terminals_do_not_starve_target_direct_load$/)
    | test(/^staged_handoff_materializes_past_former_link_quota_and_reopens_exact_winner$/)
    | test(/^task_handoff_before_begun_materializes_past_former_link_quota_without_callback$/)
    | test(/^task_store_4097_materialization_preserves_existing_tasks_listener_and_recovery$/)
    | test(/^task_store_capacity_after_reservation_is_invariant_violation_and_fail_stops$/)
    | test(/^thirty_two_lazy_cancel_actor_batch_finishes_within_125ms$/)
)
) | (
binary(unica_coder) & (
    test(/^infrastructure::daemon::medium_receipt_runtime_tests::promoted_reads_run_past_former_deadlines_and_complete_through_their_tasks$/)
    | test(/^infrastructure::daemon::v13_workspace_bootstrap::medium_tests::root_check_streams_an_index_past_the_former_capture_limit$/)
)
) | (
binary(unica_project_health) & (
    test(/^inspection::git::medium_tests::project_health_git_ignore_batch_reads_staged_blobs_past_the_former_limits_with_two_children$/)
    | test(/^inspection::resources::medium_tests::continued_repository_eol_resumes_on_disk_past_the_former_evidence_capacity$/)
    | test(/^inspection::resources::medium_tests::staged_attribute_policy_past_the_former_file_and_byte_limits_is_checked$/)
)
) | (
binary(unica_workspace) & (
    test(/^selection_evidence::tests::aggregate_selection_records_cross_former_65536_with_real_absences$/)
    | test(/^selection_evidence::tests::aggregate_selection_route_names_cross_former_8mib_with_real_absences$/)
)
) | (
binary(selection) & (
    test(/^aggregate_selection_directory_handles_cross_former_128_and_keep_finality$/)
    | test(/^aggregate_selection_exact_bytes_cross_former_32mib_without_source_walk$/)
    | test(/^aggregate_selection_membership_crosses_former_16384_across_sources$/)
)
)
'''
slow-timeout = { period = "900s", terminate-after = 2 }
threads-required = "num-cpus"
# <<< размер large (срок)

# Срок `medium` — 300 с, остановка после второго периода; `small` остаётся на
# сроке `default`. Выражение — то же, что исключают ворота `pr`; тесты `large`
# из него забирает срок `large` выше.
[[profile.default.overrides]]
filter = '''
kind(test)
    | test(/(^|::)medium(_|::|$)/)
'''
slow-timeout = { period = "300s", terminate-after = 2 }

# Тесты живого демона v5 поднимают каждый свой демон с хранилищем на диске и
# собственными сроками шагов в 2 с. Без предела модуль сам перегружает машину,
# и сроки демона истекают от голода процессора и fsync, а не от поведения
# (#2111). Группа ограничивает только одновременность, сроки не меняются.
[test-groups]
receipt-runtime = { max-threads = 4 }
# Изменяющие вызовы через настоящий MCP и демон на двухъядерном Windows
# получали `store_failed` и истечение срока submit, когда шли одновременно с
# тяжёлыми тестами поиска по большим корпусам (#2147). Группа не даёт им
# идти одновременно друг с другом; сроки и остальной прогон не меняются.
workspace-stdio = { max-threads = 1 }

# Гонка отмены со стартом задания держит отмену, пока задание стартует с
# записью на диск; срок самой отмены — 2 с. Тест занимает машину целиком,
# чтобы старт не делил её с соседями по прогону.
[[profile.default.overrides]]
filter = 'binary(unica_coder) & test(/^infrastructure::daemon::medium_receipt_runtime_tests::(exact|task_id)_cancel_racing_the_start_of_the_continued_task_ends_it_cancelled$/)'
threads-required = "num-cpus"

# Сравнивает задержку вызова MCP под потоком hover с задержкой без него. Обе
# медианы снимаются по очереди, поэтому соседи по прогону, появившиеся между
# замерами, выглядят как задержка от LSP. Допуск не меняется; тест занимает
# машину целиком, и замеры делят её только с его собственным потоком hover.
[[profile.default.overrides]]
filter = 'binary(unica_coder) & test(/^interfaces::lsp::tests::medium_an_lsp_hover_stream_does_not_delay_a_parallel_mcp_call$/)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'binary(unica_coder) & test(/^infrastructure::daemon::medium_receipt_runtime_tests::/)'
test-group = "receipt-runtime"

[[profile.default.overrides]]
filter = '''
binary(v13_workspace_bootstrap)
| (binary(v13_search_integration) & test(/^(text_search_enumerates_wide_and_aggregate_corpora_without_an_entry_quota|resolve_resources::resolve_form_and_module_paths_preserve_the_exact_resource_on_public_mcp)$/))
'''
test-group = "workspace-stdio"

# Публичная задержка отмены при Windows Job attach должна остаться в логе
# успешного прогона: общая длительность теста включает подготовку раннера.
[[profile.default.overrides]]
filter = 'test(/^interfaces::mcp::medium_tests::public_native_cancel_waits_for_slow_job_attach_before_answering$/)'
success-output = "immediate"
junit.store-success-output = true
