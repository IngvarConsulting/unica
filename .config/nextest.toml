# Релиз гоняет всё, включая `large`: тег — те же ворота, что ночь, плюс всё
# остальное.
[profile.release]
default-filter = 'all()'

# Full nightly retains the existing per-test timeout/retry overrides. The
# `large` profile below remains the size catalogue used by queue/size guards.
[profile.nightly-full]
default-filter = 'all()'

# Только ночь: интеграционные тесты, возвращённые из `#[ignore = "daemon tier"]`
# (#1835). Их отключили 04.09.2026, потому что демона было некому остановить;
# теперь каждый останавливает своих, и на macOS все проходят (замер 21.10.2026).
# До зелёного Windows в полном nightly (#1820) их исполняют только `nightly-full`
# и релиз; очередь и `main` исключают их этим выражением. Шесть из них под
# `#[cfg(unix)]` и на Windows не собираются: им достаточно ubuntu и macOS.
# Тест, подтверждённый на всех своих ОС, убирается из выражения и остаётся
# `medium`; порядок снятия всего каталога — в скилле unica-testing.
[profile.nightly-only]
default-filter = '''
(
binary(platform_project_health) & (
